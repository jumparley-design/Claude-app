<title>Vortice Taller</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Layout: phone-first app shell like Vortice Docs — fixed top bar, one view at a time, bottom tab bar; sheets slide up for forms. Single dark theme by choice, to match Vortice. */
:root{
  --bg:#070b12; --s1:#101826; --s2:#172234; --s3:#1f2d43; --line:#22324a; --line2:#2f4566;
  --text:#eaf1f8; --mut:#8ea2b8; --brand:#2f8cff; --brand2:#22d3ee; --ok:#22c57a; --warn:#ffb020; --bad:#ff5d6c; --cost:#ff8a4c;
  --f-d:"Sora","Manrope",system-ui,sans-serif; --f-b:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:radial-gradient(900px 520px at 0% -8%,rgba(47,140,255,.20),transparent 62%),radial-gradient(700px 460px at 105% 4%,rgba(34,211,238,.13),transparent 60%),var(--bg);background-attachment:fixed;color:var(--text);font:15px/1.5 var(--f-b);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0a111c}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:rgba(10,17,28,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font:700 .95rem var(--f-d);color:#04101f;flex:none}
.top h1{margin:0;font:700 1.05rem var(--f-d);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font:500 .72rem var(--f-b);color:var(--mut)}
.back{background:none;border:0;color:var(--brand2);font-weight:700;padding:6px 4px}
.sync{font-size:.7rem;font-weight:700;padding:4px 8px;border-radius:99px;background:var(--s2);color:var(--mut);white-space:nowrap}
.sync.ok{color:var(--ok)}
.icon{background:var(--s2);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:1.05rem;flex:none}
main{max-width:720px;margin:0 auto;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(10,17,28,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:720px;margin:0 auto;display:flex}
.tabs button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:1.3rem;position:relative}
.tabs button span{font-size:.62rem;font-weight:700;letter-spacing:-.01em}
.tabs button i.bdg{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font:800 .62rem/16px var(--f-b);font-style:normal;padding:0 4px}
.tabs button.on{color:var(--text)}
.tabs button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.view{display:grid;gap:14px}
h2{margin:0;font:700 1.3rem/1.2 var(--f-d);text-wrap:balance}
h3{margin:6px 0 0;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:800}
.muted{color:var(--mut);font-size:.86rem}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.hero{background:linear-gradient(135deg,rgba(47,140,255,.22),rgba(34,211,238,.10));border:1px solid var(--line2);border-radius:20px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.kpi small{display:block;color:var(--mut);font-size:.72rem;font-weight:700}
.kpi b{display:block;font:700 1.12rem var(--f-d);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis.mini{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.kpis.mini .kpi{padding:8px 6px;text-align:center}.kpis.mini small{font-size:.6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi i{font-style:normal;font-size:.72rem;font-weight:700}
.up{color:var(--ok)}.down{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-weight:800;background:var(--s2);color:var(--text);text-decoration:none;min-height:46px}
.btn:active{transform:scale(.98)}
.btn.p{background:linear-gradient(135deg,var(--brand),#1f6fd1);border-color:transparent;color:#fff}
.btn.g{background:#1a9d5f;border-color:transparent;color:#fff}
.btn.wa{background:#1fae5b;border-color:transparent;color:#fff}
.btn.d{background:transparent;color:var(--bad);border-color:#5a2a33}
.btn.sm{min-height:36px;padding:7px 11px;font-size:.84rem;border-radius:10px}
.btn.w{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 4px;display:grid;gap:4px;justify-items:center;font-size:1.4rem}
.quick button span{font-size:.7rem;font-weight:700;color:var(--mut);text-align:center;line-height:1.2}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--s2);border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:7px 12px;font-size:.84rem;font-weight:700;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip em{font-style:normal;opacity:.75;margin-left:4px}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mut);border-radius:9px;padding:9px 4px;font-weight:800;font-size:.8rem;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--s3);color:var(--text)}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%;min-width:0}
.row .em{font-size:1.5rem;width:42px;height:42px;border-radius:12px;background:var(--s2);display:grid;place-items:center;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:block;color:var(--mut);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{text-align:right;white-space:nowrap;font-weight:800}
.row .rt small{display:block;font-weight:600;color:var(--mut);font-size:.74rem}
.pill{display:inline-block;font-size:.68rem;font-weight:800;padding:3px 8px;border-radius:99px;background:#1d3150;color:#9ec9ff;white-space:nowrap}
.pill.programado{background:#1d3150;color:#9ec9ff}.pill.confirmado{background:#0f3a3f;color:#5fe3f0}.pill.en_curso{background:#3d3112;color:#ffcf66}.pill.terminado{background:#123b29;color:#5fe0a0}.pill.cancelado{background:#3d1720;color:#ff9aa5}
.empty{text-align:center;padding:22px 14px;color:var(--mut);border:1px dashed var(--line2);border-radius:var(--r)}
.empty b{display:block;color:var(--text);font-size:1rem;margin-bottom:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tile{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:12px 6px;display:grid;justify-items:center;gap:4px;text-align:center}
.tile i{font-style:normal;font-size:1.6rem}
.tile span{font-size:.74rem;font-weight:700;line-height:1.2}
.tile.on{border-color:var(--brand2);background:rgba(34,211,238,.12)}
label.f{display:grid;gap:5px;font-size:.78rem;font-weight:700;color:var(--mut);min-width:0}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px;color:var(--text);min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);border-color:transparent}
.fg{display:grid;gap:10px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.quick span{font-size:.64rem}}
/* week strip */
.week{display:grid;grid-template-columns:auto repeat(7,1fr) auto;gap:4px;align-items:stretch}
.week .nav{background:none;border:0;color:var(--mut);font-size:1.3rem;padding:0 2px}
.day{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:7px 0;display:grid;justify-items:center;gap:1px}
.day small{font-size:.64rem;color:var(--mut);font-weight:800;text-transform:uppercase}
.day b{font:700 1rem var(--f-d)}
.day .dots{height:6px;display:flex;gap:2px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--brand2)}
.day.on{background:linear-gradient(160deg,var(--brand),#1f6fd1);border-color:transparent}
.day.on small{color:#dbe9ff}.day.on .dots i{background:#fff}
.day.today b{color:var(--brand2)}.day.on.today b{color:#fff}
.job{display:grid;grid-template-columns:58px 1fr;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.job .h{font:700 1rem var(--f-d);text-align:center;border-right:1px solid var(--line);padding-right:10px}
.job .h small{display:block;font:600 .7rem var(--f-b);color:var(--mut)}
.job .b{min-width:0;display:grid;gap:4px}
.job .b b{overflow-wrap:anywhere}
.job .b small{color:var(--mut);font-size:.8rem;overflow-wrap:anywhere}
.job .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
/* chart */
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--mut);font-weight:700}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;gap:8px}
.hbar div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:.84rem}
.hbar span.t{height:7px;border-radius:4px;background:var(--s2);grid-column:1/-1;overflow:hidden}
.hbar span.t i{display:block;height:100%;border-radius:4px}
table.t{width:100%;border-collapse:collapse;font-size:.8rem}
table.t th,table.t td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--mut);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.tot{display:flex;justify-content:space-between;gap:10px;padding:6px 0;color:var(--mut)}
.tot b{color:var(--text)}
.tot.big{font:700 1.2rem var(--f-d);color:var(--text);border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
/* chat */
.chathead{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.thread{display:grid;gap:14px}
.msg.user{justify-self:end;max-width:88%;background:linear-gradient(135deg,var(--brand),#1f6fd1);color:#fff;border-radius:16px 16px 4px 16px;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user small{display:block;opacity:.8;font-size:.72rem;margin-top:4px}
.msg.bot{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px 12px;min-width:0}
.msg.bot .tag{display:flex;justify-content:space-between;align-items:center;padding-top:8px;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand2)}
.md{overflow-wrap:anywhere}
.md h2{font:700 1.02rem var(--f-d);color:var(--brand2);margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.md h3{font:700 .92rem var(--f-d);color:var(--text);text-transform:none;letter-spacing:0;margin:12px 0 4px}
.md p{margin:7px 0}.md ul,.md ol{margin:6px 0;padding-left:1.25em}.md li{margin:3px 0}
.md code{background:var(--s2);padding:1px 5px;border-radius:5px;font-size:.88em}
.md pre{background:var(--s2);padding:10px;border-radius:10px;overflow-x:auto}
.md blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--warn);background:var(--s2);border-radius:0 10px 10px 0}
.md .tbl{overflow-x:auto;margin:8px 0}
.md table{border-collapse:collapse;font-size:.86rem;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.md th{background:var(--s2)}
.md a{color:var(--brand2)}
.thinking{color:var(--mut);font-style:italic;padding:10px 0}
.thinking::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.note{font-size:.82rem;color:var(--bad);margin-top:6px}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:7;background:linear-gradient(to top,var(--bg) 72%,transparent);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.composer .in{max-width:720px;margin:0 auto}
.cbox{background:var(--s1);border:1px solid var(--line2);border-radius:16px;padding:8px;display:grid;gap:6px}
.cbox textarea{border:0;background:transparent;min-height:44px;max-height:170px;resize:none;padding:6px 8px}
.cbox textarea:focus{outline:none}
.crow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crow .grow{flex:1}
.tool{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:.8rem;font-weight:800;color:var(--text)}
.tool.on{border-color:var(--brand2);color:var(--brand2)}
.tool.rec{border-color:var(--bad);color:var(--bad)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{position:relative;width:54px;height:54px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:20px;padding:0}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(2,6,12,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet>.pan{background:var(--s1);border:1px solid var(--line2);border-bottom:0;width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet .hd h2{font-size:1.1rem}
.x{background:var(--s2);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;font-size:1rem;flex:none}
.preview{background:#0b141f;border:1px solid var(--line);border-radius:14px;padding:12px;white-space:pre-wrap;font-size:.9rem;overflow-wrap:anywhere}
.prev{background:#fff;border-radius:14px;overflow:hidden}.prev img{display:block;width:100%}
.sig{background:#fff;border-radius:12px;width:100%;height:160px;touch-action:none;display:block}
.logo-prev{background:#fff;border-radius:12px;padding:10px;text-align:center}.logo-prev img{max-width:100%;max-height:90px}
.item{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px}
.isub{font-weight:800;text-align:right;white-space:nowrap;padding:11px 0}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill.pagado,.pill.aceptada{background:#123b29;color:#5fe0a0}.pill.pendiente{background:#3d3112;color:#ffcf66}.pill.rechazada{background:#3d1720;color:#ff9aa5}
#fx h2{font-size:1.15rem}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#eaf1f8;color:#07101c;padding:10px 16px;border-radius:99px;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;z-index:40;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top gut"><div class="in">
  <button class="back" id="hBack" type="button" hidden>‹ Volver</button>
  <div class="logo" id="hLogo">V</div>
  <h1 id="hTitle">Vortice Taller<small id="hSub">Asistente · Agenda · Finanzas · Facturas</small></h1>
  <span class="sync" id="sync">Cargando…</span>
  <button class="icon" type="button" data-act="settings" aria-label="Ajustes">⚙️</button>
</div></header>

<main class="gut" id="view"></main>

<nav class="tabs" id="tabs"><div class="in">
  <button type="button" data-tab="inicio">🏠<span>Inicio</span></button>
  <button type="button" data-tab="ventas">🎯<span>Ventas</span></button>
  <button type="button" data-tab="agenda">📅<span>Agenda</span></button>
  <button type="button" data-tab="facturas">🧾<span>Facturas</span></button>
  <button type="button" data-tab="finanzas">💰<span>Finanzas</span></button>
  <button type="button" data-tab="asistente">🧠<span>Asistente</span></button>
</div></nav>

<div class="composer gut" id="composer" hidden><div class="in">
  <div class="cbox">
    <div class="thumbs" id="thumbs" hidden></div>
    <textarea id="q" rows="2" placeholder="Escribe la pregunta o lo que mediste…"></textarea>
    <div class="crow">
      <button class="tool" id="photoBtn" type="button" hidden>📷 Foto</button>
      <button class="tool" id="micBtn" type="button" hidden>🎙️ Dictar</button>
      <button class="tool" id="deepBtn" type="button">🔬 A fondo</button>
      <span class="grow"></span>
      <button class="btn p sm" id="sendBtn" type="button">Preguntar</button>
    </div>
  </div>
</div></div>

<div id="sheetRoot"></div>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" hidden>

<script>
"use strict";
(function(){
/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(typeof v==="number")return v;v=String(v||"").replace(/[^\d,.\-]/g,"");if(v.includes(","))v=v.replace(/\./g,"").replace(",",".");else if((v.match(/\./g)||[]).length>1||/\.\d{3}$/.test(v))v=v.replace(/\./g,"");return parseFloat(v)||0};
const money=n=>"$ "+Math.round(+n||0).toLocaleString("es-CO");
const short=n=>{n=Math.round(+n||0);const a=Math.abs(n);if(a>=1e6)return "$"+(n/1e6).toLocaleString("es-CO",{maximumFractionDigits:1})+"M";if(a>=1e3)return "$"+Math.round(n/1e3)+"k";return "$"+n};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const isoOf=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dOf=iso=>new Date(iso+"T12:00:00");
const addDays=(iso,n)=>{const d=dOf(iso);d.setDate(d.getDate()+n);return isoOf(d)};
const MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIA=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

const mkAdd=(k,n)=>{let [y,m]=k.split("-").map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return `${y}-${String(m).padStart(2,"0")}`};
const mkName=(k,s)=>{const [y,m]=k.split("-").map(Number);const n=MES[m-1];return s?n.slice(0,3):n.charAt(0).toUpperCase()+n.slice(1)+" "+y};
const hora12=h=>{if(!h)return "";let [H,M]=h.split(":").map(Number);const ap=H>=12?"p. m.":"a. m.";H=H%12||12;return `${H}:${String(M).padStart(2,"0")} ${ap}`};

function put(name,obj){
  obj.id=obj.id||uid();obj.upd=Date.now();
  const arr=D[name];const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj);
  cache(name);
  if(D.mode==="cloud"){const {id,...rest}=obj;const body=JSON.parse(JSON.stringify(rest));const w=()=>D.base.collection(name).doc(id).set(body);
    return w().catch(e=>{if(e&&(e.code==="resource_exhausted"||e.code==="unavailable"))return new Promise(r=>setTimeout(r,1200+Math.random()*1200)).then(w);throw e}).catch(dbErr)}
  return Promise.resolve();
}
function del(name,id){
  D[name]=D[name].filter(x=>x.id!==id);cache(name);
  if(D.mode==="cloud"){const w=()=>D.base.collection(name).doc(id).delete();return w().catch(e=>{if(e&&(e.code==="resource_exhausted"||e.code==="unavailable"))return new Promise(r=>setTimeout(r,1200+Math.random()*1200)).then(w);throw e}).catch(dbErr)}

async function initStore(){

  try{[db,user]=await Promise.all([window.claude?.use("db"),window.claude?.use("user")])}catch(e){}
  let id=null;try{id=user?await user.id():null}catch(e){}
  if(!db||!id){setSync("En este celular");storeReady=true;autoSchedule();soon();return}
  D.mode="cloud";D.base=db.doc("data/users/"+id+"/meta");
  setSync("Sincronizando…");
  let first=0;const timer=setTimeout(()=>{if(first<COLS.length)setSync("Sin conexión")},10000);
  D.base.onSnapshot(s=>{const c=s.exists&&s.data()&&s.data().cfg;if(c){D.cfg=c;LS.set("cfg",c);paintHead()}},()=>{});
  COLS.forEach(name=>{
    let got=false;
    D.base.collection(name).onSnapshot(s=>{
      D[name]=s.docs.map(d=>Object.assign({id:d.id},d.data()));cache(name);if(name==="fconf"){onConf();paintHead()}
      if(!got){got=true;first++;if(first===COLS.length){clearTimeout(timer);setSync("☁️ En tu cuenta",true);migrateLocal();storeReady=true;autoSchedule()}}
      soon();
    },e=>{clearTimeout(timer);setSync("Sin conexión")});
  });
}

function calc(d){
  const sub=(d.items||[]).reduce((a,it)=>a+num(it.c)*num(it.p),0);
  const desc=sub*num(d.desc)/100,base=sub-desc;
  const iva=d.ivaOn?base*num(d.ivaPct)/100:0,total=base+iva;
  const abono=d.tipo==="rc"?total:num(d.abono);
  const pagado=d.estado==="pagado"?total:Math.min(abono,total);
  return {sub,desc,base,iva,total,abono,pagado,saldo:Math.max(total-pagado,0)};
}

/* ================= finanzas: cálculos ================= */
function incluirV(){return D.cfg.incluirV!==false}
function monthData(k){
  const ms=D.movs.filter(m=>mk(m.fecha||"")===k);
  let ing=ms.filter(m=>m.tipo==="ingreso").reduce((a,m)=>a+num(m.monto),0);
  const vs=incluirV()?fxSales().filter(s=>mk(s.f)===k):[];
  const ingV=vs.reduce((a,s)=>a+s.monto,0);
  const costo=ms.filter(m=>m.tipo==="egreso"&&clase(m.cat)==="costo").reduce((a,m)=>a+num(m.monto),0);
  const gasto=ms.filter(m=>m.tipo==="egreso"&&clase(m.cat)!=="costo").reduce((a,m)=>a+num(m.monto),0);
  ing+=ingV;
  return {k,ing,ingV,costo,gasto,egr:costo+gasto,util:ing-costo-gasto,margen:ing?((ing-costo-gasto)/ing*100):0,ms,vs};
}
function projection(k,esc){
  // usa los meses cerrados con movimientos antes del mes actual
  const cur=mk(today());const hist=[];
  for(let i=1;i<=6;i++){const m=mkAdd(cur,-i);const d=monthData(m);if(d.ing||d.egr)hist.unshift(d)}
  const fac=esc==="cons"?0.85:esc==="opt"?1.15:1;
  if(hist.length<2)return {ok:false,hist,rows:[]};
  const fit=key=>{const ys=hist.map(h=>h[key]);const n=ys.length;const avg=ys.reduce((a,b)=>a+b,0)/n;
    if(n<3)return i=>avg;
    const xs=ys.map((_,i)=>i);const mx=(n-1)/2;let sxy=0,sxx=0;xs.forEach((x,i)=>{sxy+=(x-mx)*(ys[i]-avg);sxx+=(x-mx)**2});const b=sxx?sxy/sxx:0;
    return i=>Math.max(0,0.5*avg+0.5*(avg+b*(n-1+i-mx)))};
  const fi=fit("ing"),fe=fit("egr");
  const rows=[0,1,2].map(i=>{const m=mkAdd(cur,i);const ing=fi(i+1)*fac,egr=fe(i+1);return {k:m,ing,egr,util:ing-egr}});
  return {ok:true,hist,rows};
}

const RULES=`Eres el asistente técnico de un taller colombiano de refrigeración comercial e industrial, aire acondicionado, hornos de panadería (rotativos, atmosféricos, de pisos, tótem, gaveteros, pandeboneros, fermentadoras), maquinaria de plantas de panificación y alimentos (mojadoras/amasadoras, cilindros/laminadoras de masa, batidoras, divisoras, selladoras y empacadoras, bandas transportadoras), malacates y elevadores de carga, compresores de aire, extracción, mantenimiento locativo, soldadura, estructuras metálicas y cerramientos, y electricidad. Respondes a un técnico profesional como lo haría un técnico senior con 30 años de campo y formación de ingeniería.

Contexto: Colombia, 60 Hz, tensiones 120, 208, 220/240 y 440/480 V; gas natural y GLP. Normas de referencia cuando apliquen: RETIE, NTC 2050, Resolución 90902 de 2013 (instalaciones de gas), NTC 2505, ASHRAE, AWS D1.1/D1.3. Da unidades métricas y, cuando ayude, las de campo (psi, °F, BTU/h, TR, AWG).

Cómo respondes:
- En español, directo y elaborado: cada frase aporta algo aplicable. Sin saludos ni relleno.
- Para fallas o códigos usa estas secciones con "##":
  ## Diagnóstico rápido (causa más probable en 2-3 líneas y por qué)
  ## Causas probables (de más a menos probable, con la señal que la confirma o descarta)
  ## Pruebas paso a paso (qué medir, con qué instrumento, dónde y el valor normal; usa tablas para comparar valores)
  ## Solución y opciones (repuesto original, equivalente o arreglo provisional, con ventajas, riesgos y costo relativo)
  ## Seguridad (solo lo que aplica: gas, refrigerante inflamable, tensión, presión, humos)
  ## Fuentes (manuales o boletines del fabricante, normas, tablas P-T, guías técnicas reales: Copeland/Emerson, Danfoss, Sporlan, Tecumseh, Embraco, Bitzer, Honeywell, Carrier, LG, Samsung, Lincoln Electric, Miller, ASHRAE, RSES…)
- Para instalación, mantenimiento, cálculo, repuestos o normas, adapta: resultado o lista de pasos primero, luego procedimiento con números y fórmulas, luego fuentes.
- Si faltan datos que cambian el diagnóstico, da igual la mejor ruta y cierra con "## Para afinar" con máximo 3 preguntas concretas.
- Exactitud: no inventes códigos de error, valores de placa, números de parte, títulos de documentos ni enlaces. Si un dato depende de la marca o el modelo y no estás seguro, dilo e indica dónde verificarlo. Distingue dato de fabricante o norma de práctica de campo.
- Si hay fotos, primero di lo que lees en ellas (placa, código, cableado, estado) y úsalo.`;

const SERR={not_granted:"No se autorizó el uso de Claude en esta página. Recárgala y acepta el permiso.",sampling_disabled:"Claude no está disponible para esta cuenta.",rate_limited:"Llegaste al límite de consultas por ahora. Intenta en unos minutos.",session_expired:"Tu sesión expiró. Inicia sesión de nuevo y recarga.",image_rejected:"Esa foto no se pudo usar. Prueba con otra JPG o PNG.",images_unavailable:"Aquí no se pueden enviar fotos; escribe lo que dice la placa.",refused:"No hubo respuesta para esa consulta. Reformúlala con más detalle técnico.",empty_completion:"No llegó respuesta. Intenta de nuevo.",prompt_too_large:"La consulta es muy larga. Empieza una nueva.",upstream_error:"Se cortó la conexión. Toca Preguntar de nuevo."};
async function ask(){
  if(busy){ctl&&ctl.abort();return}
  if(!SUB||SUB.kind!=="chat")return;
  const c=D.consultas.find(x=>x.id===SUB.id);if(!c)return;
  const text=q.value.trim();if(!text&&!pending.length)return;
  if(!sample){toast("Abre este enlace en claude.ai con tu cuenta para preguntar");return}
  const imgs=pending.slice();const e=eq(c.equipo),t=tc(c.tipo);const dat=c.datos||{};
  let content="";
  if(!(c.turns||[]).length){
    content+=`[Equipo: ${e.n} — ${e.d}]\n[Tipo de consulta: ${t.n}]\n`;
    const dl=[["Marca/modelo",dat.modelo],["Refrigerante/gas",dat.gas],["Alimentación",dat.volt],["Mediciones",dat.med]].filter(x=>x[1]);
    if(dl.length)content+="[Datos del equipo]\n"+dl.map(x=>`- ${x[0]}: ${x[1]}`).join("\n")+"\n";
    content+="\n";
  }
  if(imgs.length)content+=`[Adjunto ${imgs.length} foto(s): léelas y úsalas]\n`;
  content+=text||"Analiza las fotos y dime qué ves y qué revisar.";
  const ut={role:"user",content,display:text||"(fotos)",photos:imgs.length||0};
  c.turns=(c.turns||[]).concat([ut]);
  const th=$("#thread");if(th.querySelector(".empty"))th.innerHTML="";
  th.append(userBubble(ut));
  q.value="";autosize();pending=[];paintThumbs();
  const bot=botBubble(null);bot._thinking();th.append(bot);bot.scrollIntoView({behavior:"smooth",block:"start"});
  busy=true;$("#sendBtn").textContent="Detener";
  ctl=new AbortController();
  const hist=c.turns.slice(-12).map(x=>({role:x.role,content:x.content}));while(hist.length&&hist[0].role!=="user")hist.shift();
  const ctx=`${RULES}\n\nEsta conversación es sobre: ${e.n} (${e.d}). Tipo de consulta: ${t.n}.`;
  const opts={cache:false,signal:ctl.signal,modelTier:deep?"complex":"default",onText:({text})=>bot._set(text)};
  if(imgs.length&&canImages)opts.images=imgs;
  try{
    const r=await sample([{role:"user",content:ctx},...hist],opts);
    bot._set(r.text);c.turns.push({role:"assistant",content:r.text});
    if(r.truncated)bot._note("La respuesta quedó cortada. Pide que continúe.");
  }catch(err){
    const code=err&&err.code;
    if(err&&err.text){bot._set(err.text);c.turns.push({role:"assistant",content:err.text})}
    if(code==="cancelled"){if(!err.text)bot.remove()}
    else bot._note(SERR[code]||SERR.upstream_error);
  }finally{
    busy=false;$("#sendBtn").textContent="Preguntar";
    c.turns=c.turns.slice(-16).map(x=>x.content&&x.content.length>24000?Object.assign({},x,{content:x.content.slice(0,24000)}):x);
    put("consultas",c);
  }
}

function tplText(id,j){

  const cuando=j.fecha===today()?"hoy":j.fecha===addDays(today(),1)?"mañana":longD(j.fecha);
  switch(id){
   case "conf":return `✅ *Servicio agendado*\n\nHola ${nom} 👋, tu servicio quedó programado:\n\n${det}\n📝 Ten el equipo despejado y con acceso a la toma eléctrica.\n🔁 Si necesitas cambiar la hora, responde este mensaje.\n\n¡Gracias por confiar en nosotros! 🙌${firma}`;
   case "rec":return `⏰ *Recordatorio de servicio*\n\nHola ${nom} 👋, te recordamos tu cita de *${cuando}*:\n\n${L("🕐","Hora",hora12(j.hora))}${L("🛠️","Servicio",j.servicio)}${L("📍","Dirección",j.dir)}\n👍 Confírmanos con un *SÍ* por favor.${firma}`;

   case "fin":return `🛠️ *Servicio terminado*\n\nHola ${nom} 👋, terminamos el trabajo:\n\n✔️ *${j.servicio||"Servicio"}* · ${e.i} ${e.n}\n${j.notas?"📝 "+j.notas+"\n":""}${num(j.valor)?"💵 *Valor:* "+money(j.valor)+"\n":""}\n🧾 En breve te enviamos la cuenta de cobro.\n🛡️ Garantía de mano de obra por escrito.\n\n¡Gracias por tu confianza! 🙌${firma}`;
   case "rep":return `🔁 *Cambio de cita*\n\nHola ${nom} 👋, necesitamos mover tu servicio. La nueva cita queda así:\n\n${det}\n🙏 Disculpa el cambio. Si no te sirve, responde y buscamos otra hora.${firma}`;

function barChart(series,proj,sel){
  const all=[...series.map(s=>({k:s.k,a:s.ing,b:s.egr,p:false})),...proj.map(p=>({k:p.k,a:p.ing,b:p.egr,p:true}))];
  const W=Math.max(420,all.length*62),H=210,pl=44,pb=28,pt=18,ch=H-pt-pb;
  const max=Math.max(1,...all.map(x=>Math.max(x.a,x.b)));
  const step=Math.pow(10,Math.floor(Math.log10(max)));const nice=Math.ceil(max/step)*step;const top=nice<max*1.05?nice+step:nice;
  const y=v=>pt+ch-(v/top)*ch;const gw=(W-pl-8)/all.length;const bw=Math.min(18,gw*0.3);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y egresos por mes"><defs><pattern id="hp" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.5" height="5" fill="#2f8cff"></rect></pattern><pattern id="hc" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.5" height="5" fill="#ff8a4c"></rect></pattern></defs>`;
  for(let i=0;i<=4;i++){const v=top*i/4;s+=`<line x1="${pl}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="#22324a" stroke-width="1"></line><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#8ea2b8">${esc(short(v))}</text>`}
  all.forEach((x,i)=>{const cx=pl+gw*i+gw/2;const on=x.k===sel;
    const r=(v,dx,fill,pat)=>{const h=Math.max(v>0?2:0,ch*(v/top));return `<rect x="${cx+dx}" y="${pt+ch-h}" width="${bw}" height="${h}" rx="3" fill="${x.p?`url(#${pat})`:fill}" ${x.p?`stroke="${fill}" stroke-width="1"`:""} opacity="${on||x.p?1:.78}"></rect>`};
    s+=r(x.a,-bw-1,"#2f8cff","hp")+r(x.b,1,"#ff8a4c","hc");
    s+=`<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="11" font-weight="${on?800:600}" fill="${on?"#eaf1f8":"#8ea2b8"}">${esc(mkName(x.k,true))}${x.p?"*":""}</text>`;
    if(on&&(x.a||x.b))s+=`<text x="${cx}" y="${Math.max(12,y(Math.max(x.a,x.b))-6)}" text-anchor="middle" font-size="10" font-weight="800" fill="#eaf1f8">${esc(short(x.a-x.b))}</text>`;
  });
  return s+"</svg>";
}

function vCotizar(B){

     <div class="fg2"><label class="f">Transporte<input data-k="tr" inputmode="numeric" value="${esc(s.tr)}" placeholder="$ 0"></label><label class="f">Imprevistos %<input data-k="imp" inputmode="decimal" value="${esc(s.imp)}"></label></div>

    obj(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PHt}] /Resources << /XObject << /Im${i} ${iid} 0 R >> >> /Contents ${cid} 0 R >>`);
    const cs=`q ${PW} 0 0 ${PHt} 0 0 cm /Im${i} Do Q`;obj(cid,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[iid]=len;push(`${iid} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`);
    push(bytes);push("\nendstream\nendobj\n")});
  const total=2+n*3,xref=len;let x=`xref\n0 ${total+1}\n0000000000 65535 f \n`;
  for(let i=1;i<=total;i++)x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  push(x+`trailer\n<< /Size ${total+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  const out=new Uint8Array(len);let p=0;for(const b of parts){out.set(b,p);p+=b.length}return out;
}

async function shrinkImg(src,maxW,limit){

  let w=Math.min(maxW,img.width),out="";

    const x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);out=c.toDataURL("image/png");
    if(out.length>limit){const j=document.createElement("canvas");j.width=c.width;j.height=c.height;const jx=j.getContext("2d");jx.fillStyle="#fff";jx.fillRect(0,0,j.width,j.height);jx.drawImage(c,0,0);out=j.toDataURL("image/jpeg",.85)}
    if(out.length<=limit)return out;w=Math.round(w*.75)}
  return out.length<=limit?out:null;
}

async function restoreBackup(b){
  const msg=$("#bkMsg"),btn=$("#bkIn");if(btn){btn.disabled=true;btn.textContent="Restaurando…"}
  const docs=(b.DOCS||[]).filter(d=>d&&d.tipo&&d.cliente).map(d=>Object.assign(clone(d),{id:/^[A-Za-z0-9_\-]+$/.test(d.id||"")?d.id:uid()}));
  const cli=(b.CLI||[]).filter(c=>c&&c.nombre);
  const s=Object.assign(clone(DEF),b.S||{});s.pref=Object.assign(clone(DEF.pref),s.pref);s.next=Object.assign(clone(DEF.next),s.next);
  const logo=s.logo?await shrinkImg(s.logo,700,230000):null,firma=s.firma?await shrinkImg(s.firma,700,200000):null;
  const ops=[];
  const keep=new Set(docs.map(d=>d.id));
  D.fdocs.filter(x=>!keep.has(x.id)).forEach(x=>ops.push(()=>del("fdocs",x.id)));
  D.fcli.slice().forEach(x=>ops.push(()=>del("fcli",x.id)));
  (D.vortice||[]).slice().forEach(x=>ops.push(()=>del("vortice",x.id)));
  docs.forEach(d=>ops.push(()=>put("fdocs",d)));
  cli.forEach(c=>ops.push(()=>put("fcli",{id:uid(),nombre:c.nombre,doc:c.doc||"",tel:c.tel||"",dir:c.dir||"",email:c.email||""})));
  clearTimeout(sT);sT=null;clearTimeout(cT);cT=null;
  const {logo:_l,firma:_f,...rest}=s;
  ops.push(()=>put("fconf",{id:"settings",s:rest}),()=>put("fconf",{id:"logo",data:logo||""}),()=>put("fconf",{id:"firma",data:firma||""}),()=>put("fconf",{id:"catalog",items:Array.isArray(b.CAT)?b.CAT:clone(DEFCAT)}));
  let done=0;const N=ops.length;
  const worker=async()=>{while(ops.length){const op=ops.shift();await op();done++;if(msg&&done%5===0)msg.textContent=`Restaurando… ${done} de ${N}`}};
  await Promise.all([worker(),worker(),worker()]);
  S=Object.assign(s,{logo,firma});CATL=Array.isArray(b.CAT)?clone(b.CAT):clone(DEFCAT);
  toast(`Copia restaurada: ${docs.length} documentos ✔`);FX.tab="docs";render();
}

const VIS=[["semanal","Semanal","cada semana"],["quincenal","Quincenal","cada 15 días"],["mensual","Mensual","cada mes"],["bimestral","Bimestral","cada 2 meses"],["trimestral","Trimestral","cada 3 meses"],["llamado","Solo por fallas","cuando haya una falla (por llamado)"]];
const visN=v=>VIS.find(x=>x[0]===v)||VIS[2];
const DOW=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const CMES=[[1,"cada mes"],[2,"cada 2 meses"],[3,"cada 3 meses"]];
const DEF_INC="Revisión preventiva de los equipos cubiertos según su lista de chequeo\nLimpieza, lubricación y ajuste de partes móviles (correas, cadenas, rodamientos)\nRevisión de presiones, temperaturas y amperajes\nRevisión de quemadores, ignición y sensores de llama (hornos)\nApriete de conexiones eléctricas y revisión de tableros\nReporte con fotos y recomendaciones después de cada visita";
const mIdx=k=>{const [y,m]=k.split("-").map(Number);return y*12+m-1};
const kVis=c=>c.visitas||({1:"mensual",2:"bimestral",3:"trimestral"}[+c.freq]||"mensual");
const kCM=c=>+c.cobroMeses||+c.freq||1;
const kMonths=c=>({mensual:1,bimestral:2,trimestral:3})[kVis(c)]||0;
// Visitas programadas: devuelve [{key,fecha}] dentro de la ventana
function kVisits(c,desde,hasta){
  if(c.estado!=="activo")return [];const v=kVis(c),st=c.inicio||today(),out=[];
  if(v==="llamado")return out;
  if(v==="semanal"||v==="quincenal"){
    const dow=+(c.dow??1);let d=desde<st?st:desde;
    for(let i=0;i<40&&d<=hasta;i++){const dd=dOf(d);
      if(dd.getDay()===dow){const ok=v==="semanal"||Math.round((dOf(weekStart(d))-dOf(weekStart(st)))/(7*864e5))%2===0;if(ok)out.push({key:d,fecha:d})}
      d=addDays(d,1)}
  }else{
    const n=kMonths(c);let p=mk(desde);const stm=mk(st);
    for(let i=0;i<3&&p<=mk(hasta);i++,p=mkAdd(p,1)){if(p<stm||(mIdx(p)-mIdx(stm))%n)continue;
      const [y,m]=p.split("-").map(Number);const dim=new Date(y,m,0).getDate();let f=`${p}-${String(Math.min(+c.dia||10,dim)).padStart(2,"0")}`;
      if(p===mk(today())&&f<today())f=today();if(f>=st)out.push({key:p,fecha:f})}
  }
  return out.filter(x=>!(c.omit||[]).includes(x.key));
}
const kJobId=(c,key)=>"kv_"+c.id+"_"+key;
function kJob(c,key){return D.trabajos.find(j=>j.id===kJobId(c,key))}
function kNext(c){const js=D.trabajos.filter(j=>j.contrato===c.id&&j.periodo&&j.estado!=="terminado"&&j.estado!=="cancelado").sort((a,b)=>a.fecha.localeCompare(b.fecha));return js[0]||null}
let storeReady=false;
function autoSchedule(){
  if(!storeReady)return;const t=today(),hasta=addDays(t,13);
  D.contratos.forEach(c=>{
    const win=kMonths(c)?addDays(t,40):hasta;
    kVisits(c,t,win).forEach(v=>{if(kJob(c,v.key))return;const e=(c.equipos||[])[0]||"otro";
      put("trabajos",{id:kJobId(c,v.key),cliente:c.cliente,tel:c.tel||"",dir:c.dir||"",fecha:v.fecha,hora:c.hora||"08:00",dur:"2",equipo:e,servicio:"Mantenimiento preventivo",tecnico:c.tecnico||D.cfg.tecnico||"",valor:"",notas:`🔁 Contrato · visita ${visN(kVis(c))[1].toLowerCase()}${c.detalle?" · "+c.detalle:""}`,estado:"programado",notif:[],contrato:c.id,periodo:v.key})});
  });
}

const kDesde=c=>c.cobroDesde||(()=>{const i=c.inicio||today();return +i.slice(8,10)>15?mkAdd(mk(i),1):mk(i)})();
function kBillDue(c,p){if(c.estado!=="activo"||!(num(c.valor)>0))return false;const st=kDesde(c);if(p<st)return false;return (mIdx(p)-mIdx(st))%kCM(c)===0&&!(c.omitCobro||[]).includes(p)}
function kDoc(c,p){return D.fdocs.find(d=>d.id==="kc_"+c.id+"_"+p)}
function kCobrosPend(){

   <div class="fg2"><label class="f">Forma de pago<select id="kA"><option value="0" ${!c.anticipado?"selected":""}>Mes vencido</option><option value="1" ${c.anticipado?"selected":""}>Mes adelantado</option></select></label><label class="f">Desc. en trabajos extra %<input id="kM" inputmode="decimal" value="${esc(c.descMO)}"></label></div>
   <div class="fg2"><label class="f">Inicia<input id="kI" type="date" value="${esc(c.inicio)}"></label><label class="f">Cobrar desde (mes)<input id="kCd" type="month" value="${esc(kDesde(c))}"></label></div>
   <div class="fg2"><label class="f">Estado<select id="kS">${["activo","pausado","terminado"].map(s=>`<option ${s===c.estado?"selected":""}>${s}</option>`).join("")}</select></label><div></div></div>
   <label class="f">Incluye (una cosa por línea)<textarea id="kN" style="min-height:130px">${esc(c.incluye)}</textarea></label>
   <button class="btn p w" type="button" id="kSv">Guardar contrato</button>
   <a class="btn wa w" id="kWa" target="_blank" rel="noopener" href="#">📲 Enviar propuesta por WhatsApp</a>
   ${!isNew?`<button class="btn d w" type="button" id="kDel">Eliminar contrato</button>`:""}</div>`,pan=>{
    const g=id=>pan.querySelector("#"+id);
    const read=()=>Object.assign(c,{cliente:g("kC").value.trim(),tel:g("kT").value.trim(),dir:g("kD").value.trim(),detalle:g("kX").value.trim(),valor:num(g("kV").value)||"",visitas:g("kVi").value,dow:+g("kDow").value,dia:Math.min(28,Math.max(1,parseInt(g("kDi").value)||10)),hora:g("kH").value||"08:00",cobroMeses:+g("kCm").value,anticipado:g("kA").value==="1",inicio:g("kI").value||today(),cobroDesde:g("kCd").value||"",descMO:num(g("kM").value),tecnico:g("kK").value.trim(),estado:g("kS").value,incluye:g("kN").value});
    const vis=()=>{const v=g("kVi").value;g("kDowW").hidden=!(v==="semanal"||v==="quincenal");g("kDiW").hidden=!["mensual","bimestral","trimestral"].includes(v);g("kHW").hidden=v==="llamado"};vis();
    const pa=()=>{read();const t=phone(c.tel);g("kWa").href=(t?"https://wa.me/"+t:"https://wa.me/")+"?text="+encodeURIComponent(kText(c))};pa();
    pan.addEventListener("input",pa);pan.addEventListener("change",()=>{vis();pa()});
    g("kC").addEventListener("change",()=>{const x=cl.find(y=>y.n.toLowerCase()===g("kC").value.trim().toLowerCase());if(x){if(!g("kT").value)g("kT").value=x.tel||"";if(!g("kD").value)g("kD").value=x.dir||"";pa()}});
    g("kE").onclick=e=>{const b=e.target.closest("[data-e]");if(!b)return;const id=b.dataset.e;c.equipos=(c.equipos||[]).includes(id)?c.equipos.filter(x=>x!==id):(c.equipos||[]).concat([id]);b.classList.toggle("on");pa()};
    g("kSv").onclick=()=>{read();if(!c.cliente){toast("Escribe el cliente");return}if(!c.equipos.length){toast("Escoge al menos un equipo o servicio");return}
      delete c.freq;put("contratos",c);upsertClient({nombre:c.cliente,tel:c.tel,dir:c.dir});
      // visitas futuras sin hacer: se borran y se vuelven a crear con la nueva programación
      const valid=new Set(kVisits(c,today(),addDays(today(),45)).map(v=>kJobId(c,v.key)));
      D.trabajos.filter(j=>j.contrato===c.id&&j.periodo&&j.estado==="programado"&&j.fecha>=today()).forEach(j=>{if(!valid.has(j.id)||c.estado!=="activo")del("trabajos",j.id);else{Object.assign(j,{cliente:c.cliente,tel:c.tel,dir:c.dir,hora:c.hora,equipo:c.equipos[0]});const v=kVisits(c,today(),addDays(today(),45)).find(x=>kJobId(c,x.key)===j.id);if(v)j.fecha=v.fecha;put("trabajos",j)}});
      onSaved&&onSaved(c);autoSchedule();toast(c.visitas==="llamado"?"Contrato guardado ✔ Usa 🚨 Falla cuando te llamen":"Contrato guardado ✔ Las visitas quedaron en la agenda");closeSheet()};
    g("kWa").addEventListener("click",()=>{read();if(!c.cliente)return;if(isNew&&!D.contratos.some(x=>x.id===c.id)){put("contratos",Object.assign({},c,{estado:"pausado"}));toast("Guardado como “pausado”. Si acepta, ponlo “activo”")}});
    if(g("kDel"))twoTap(g("kDel"),"¿Eliminar contrato y sus visitas pendientes? Toca otra vez",()=>{D.trabajos.filter(j=>j.contrato===c.id&&j.periodo&&j.estado!=="terminado").forEach(j=>del("trabajos",j.id));del("contratos",c.id);toast("Contrato eliminado");closeSheet()});
  });
}

/* ================= REPORTE DE VISITA (cualquier trabajo) ================= */
const CHK={
  frio:["Limpieza de condensador","Limpieza de evaporador","Presiones de trabajo","Temperatura de trabajo","Ventiladores","Empaques y puertas","Deshielo y drenaje","Conexiones eléctricas"],
  aire:["Limpieza de filtros","Lavado de evaporador","Lavado de condensadora","Drenaje","Presiones de trabajo","Amperaje del compresor","Conexiones eléctricas","Control y sensores"],
  horno:["Quemadores y llama","Ignición y sensor de llama / termocupla","Control de temperatura","Ventilador y motor","Giro del carro / rodamientos","Empaques de puerta","Ductos y extracción","Prueba de fugas de gas"],
  gavet:["Resistencias","Humidificación","Control de temperatura y humedad","Empaques y puertas","Ventilador"],
  maq:["Correas y poleas","Cadenas y piñones","Rodamientos y chumaceras","Lubricación / engrase","Reductor (nivel de aceite)","Motor: amperaje y temperatura","Rodillos, ganchos, cuchillas o tazón","Guardas y paro de emergencia","Contactores y conexiones","Ruidos y vibraciones"],
  sell:["Resistencias de sellado","Mordazas / teflón","Control de temperatura","Cuchilla de corte","Neumática (presión y fugas)","Sensores y fotocelda","Motor y transmisión","Paro de emergencia"],
  malac:["Cable de acero (desgaste, hilos rotos)","Gancho y seguro","Freno","Finales de carrera","Botonera y paro de emergencia","Motor y reductor","Estructura, rieles y anclajes","Lubricación"],
  comp:["Nivel de aceite","Purga de condensados","Filtro de aire","Correas","Presostato","Válvula de seguridad","Fugas en la red","Motor: amperaje"],
  extr:["Motor y rodamientos","Correas","Limpieza de campana y filtros","Ductos","Anclajes y vibración"],
  loc:["Cubierta y goteras","Canales y bajantes","Pisos y sifones","Puertas, rejas y cerraduras","Iluminación","Tomas e interruptores","Pintura y humedades","Redes hidráulicas (fugas)"],
  sold:["Inspección de soldaduras","Corrosión y pintura","Anclajes y tornillería","Cerramientos (mallas, rejas, láminas)"],
  elec:["Apriete de borneras","Protecciones / breakers","Contactores y relés","Puesta a tierra","Consumo (amperaje)"],
  otro:["Inspección general","Limpieza","Prueba de funcionamiento"]};
const grp=id=>({frio_com:"frio",frio_ind:"frio",aire:"aire",h_rot:"horno",h_atm:"horno",totem:"horno",pandeb:"horno",gavet:"gavet",mojadora:"maq",cilindro:"maq",batidora:"maq",banda:"maq",selladora:"sell",malacate:"malac",compresor:"comp",extraccion:"extr",locativo:"loc",sold:"sold",elec:"elec"})[id]||"otro";
const GRPN={frio:"🧊 Refrigeración",aire:"❄️ Aire acondicionado",horno:"🔥 Hornos",gavet:"🗄️ Gaveteros / fermentación",maq:"⚙️ Maquinaria de producción",sell:"📦 Selladoras / empaque",malac:"🏗️ Malacate / elevación",comp:"💨 Aire comprimido",extr:"🌬️ Extracción",loc:"🏢 Locativo",sold:"⚒️ Estructuras y cerramientos",elec:"⚡ Eléctrico",otro:"🛠️ General"};
function reportSheet(j){
  if(!j)return;
  const k=j.contrato?D.contratos.find(c=>c.id===j.contrato):null;
  let groups=[...new Set([j.equipo,...(j.periodo&&k?k.equipos||[]:[])].map(grp))];
  const R=j.reporte?JSON.parse(JSON.stringify(j.reporte)):{items:{},med:"",obs:"",rec:""};
  groups.forEach(gk=>CHK[gk].forEach(it=>{const key=gk+"|"+it;if(!R.items[key])R.items[key]="na"}));
  let photos=[];
  const ST={ok:["✔ OK","var(--ok)"],at:["⚠️ Atención","var(--warn)"],na:["— N/A","var(--mut)"]};
  sheet("Reporte · "+(j.cliente||""),`<div class="muted">Toca cada punto: ✔ OK → ⚠️ Atención → N/A.</div>
   <div class="chips" id="rpGr" style="flex-wrap:wrap"></div>
   <div id="rpL" class="fg"></div>
   <label class="f">Mediciones<textarea id="rpM" placeholder="Ej: Succión 65 psi · Descarga 260 psi · 7,2 A · Cámara −18 °C">${esc(R.med)}</textarea></label>
   <label class="f">Observaciones<textarea id="rpO" placeholder="Lo que encontraste">${esc(R.obs)}</textarea></label>
   <label class="f">Recomendaciones<textarea id="rpR" placeholder="Qué se debe cambiar o vigilar">${esc(R.rec)}</textarea></label>
   <button class="btn" type="button" id="rpF">📸 Agregar fotos (hasta 6)</button><div class="thumbs" id="rpT"></div>
   <label style="display:flex;gap:8px;align-items:center;font-weight:700"><input type="checkbox" id="rpDone" ${j.estado!=="terminado"?"checked":""} style="width:auto;transform:scale(1.3)"> Marcar el trabajo como terminado</label>
   <button class="btn p w" type="button" id="rpG">📋 Generar reporte</button>
   <div id="rpOut" class="fg"></div>`,pan=>{
    const L=pan.querySelector("#rpL");
    const drawL=()=>{L.innerHTML=groups.map(gk=>`<div class="card" style="padding:10px"><b>${esc(GRPN[gk])}</b><div class="list" style="margin-top:6px">${CHK[gk].map(it=>{const key=gk+"|"+it;const s=R.items[key];return `<button type="button" class="row" data-k="${esc(key)}" style="padding:9px 10px"><span class="tx"><b style="white-space:normal;font-weight:600">${esc(it)}</b></span><span class="rt" style="color:${ST[s][1]}">${ST[s][0]}</span></button>`}).join("")}</div></div>`).join("")};
    const GR=pan.querySelector("#rpGr");
    const drawG=()=>{GR.innerHTML=Object.keys(CHK).map(gk=>`<button class="chip ${groups.includes(gk)?"on":""}" type="button" data-g="${gk}">${esc(GRPN[gk])}</button>`).join("")};
    GR.onclick=e=>{const b=e.target.closest("[data-g]");if(!b)return;const gk=b.dataset.g;groups=groups.includes(gk)?groups.filter(x=>x!==gk):groups.concat([gk]);groups.forEach(g2=>CHK[g2].forEach(it=>{if(!R.items[g2+"|"+it])R.items[g2+"|"+it]="na"}));drawG();drawL()};
    drawG();drawL();
    L.onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;const k2=b.dataset.k;R.items[k2]=R.items[k2]==="na"?"ok":R.items[k2]==="ok"?"at":"na";drawL()};
    const fi=document.createElement("input");fi.type="file";fi.accept="image/*";fi.multiple=true;
    const drawT=()=>{const t=pan.querySelector("#rpT");t.innerHTML="";photos.forEach((f,i)=>{const w=document.createElement("div");w.className="thumb";const im=document.createElement("img");im.alt="Foto";im.src=URL.createObjectURL(f);const x=document.createElement("button");x.type="button";x.textContent="×";x.onclick=()=>{photos.splice(i,1);drawT()};w.append(im,x);t.append(w)})};
    pan.querySelector("#rpF").onclick=()=>fi.click();fi.onchange=()=>{photos=photos.concat([...fi.files]).slice(0,6);fi.value="";drawT()};
    pan.querySelector("#rpG").onclick=async()=>{
      R.med=pan.querySelector("#rpM").value.trim();R.obs=pan.querySelector("#rpO").value.trim();R.rec=pan.querySelector("#rpR").value.trim();R.f=today();
      j.reporte=R;if(pan.querySelector("#rpDone").checked)j.estado="terminado";put("trabajos",j);
      const out=pan.querySelector("#rpOut");out.innerHTML=`<div class="muted">Generando reporte…</div>`;
      try{
        const imgs=[];for(const f of photos){const im=await loadImg(URL.createObjectURL(f));if(im)imgs.push(im)}
        const v={j,k,groups,R,imgs};
        const logo=await loadImg(S.logo||LOGO_DEF),firma=await loadImg(S.firma);
        const m=document.createElement("canvas");m.width=1240;m.height=10;const r1=drawReport(m.getContext("2d"),v,{logo,firma});
        const c=document.createElement("canvas");c.width=1240;c.height=Math.ceil(r1.h);const r2=drawReport(c.getContext("2d"),v,{logo,firma});
        const pdf=await toPdf(c,r2.breaks),img=await canvasBlob(c,"image/jpeg",.88);
        const name=("Reporte "+(j.cliente||"")+" "+fmtD(R.f).replace(/\//g,"-")).replace(/[^\w\- áéíóúñÁÉÍÓÚÑ]/g,"").trim().replace(/\s+/g,"_");
        const F={pdf:new File([pdf],name+".pdf",{type:"application/pdf"}),img:new File([img],name+".jpg",{type:"image/jpeg"})};
        const vals=Object.entries(R.items);const ok=vals.filter(x=>x[1]==="ok").length,at=vals.filter(x=>x[1]==="at").map(x=>x[0].split("|")[1]);
        const msg=`📋 *Reporte de mantenimiento*\n\nHola ${(j.cliente||"").split(" ")[0]} 👋, terminamos la visita de hoy:\n\n✅ ${ok} puntos revisados en buen estado\n${at.length?"⚠️ Para atender: "+at.join(", ")+"\n":""}${R.rec?"📝 *Recomendaciones:* "+R.rec+"\n":""}\nTe envío el reporte completo con fotos en PDF. 🙌\n— *${empresa()}*`;
        const tel=phone(j.tel);
        out.innerHTML=`<div class="prev"><img src="${URL.createObjectURL(img)}" alt="Reporte"></div><div class="grid2"><button class="btn g" type="button" id="rpP">📤 PDF</button><button class="btn" type="button" id="rpI">🖼️ Imagen</button></div><a class="btn wa w" target="_blank" rel="noopener" href="${(tel?"https://wa.me/"+tel:"https://wa.me/")+"?text="+encodeURIComponent(msg)}">💬 Mensaje por WhatsApp</a><div class="muted">Envía primero el PDF y luego el mensaje. Las fotos no se guardan en la app: el PDF las conserva.</div>`;
        out.querySelector("#rpP").onclick=()=>shareFile(F.pdf);out.querySelector("#rpI").onclick=()=>shareFile(F.img);
        out.scrollIntoView({behavior:"smooth"});
      }catch(e){out.innerHTML=`<div class="note">No se pudo generar el reporte: ${esc(e.message||"error")}</div>`}
    };
  });
}
function drawReport(ctx,v,imgs){
  const {j,k,R}=v;const groups=v.groups.filter(gk=>CHK[gk].some(it=>R.items[gk+"|"+it]&&R.items[gk+"|"+it]!=="na"));
  const W=1240,M=70,C=S.color||"#1f6fd1",DARK="#0f2233",MUT="#5b6b7a",F='"Helvetica Neue", Helvetica, Arial, sans-serif';
  const font=(s,b)=>ctx.font=(b?"700 ":"400 ")+s+"px "+F;const breaks=[];let y=60;
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,ctx.canvas.height);ctx.fillStyle=C;ctx.fillRect(0,0,W,14);
  let ly=y;if(imgs.logo){let lh=110,lw=imgs.logo.width*lh/imgs.logo.height;if(lw>440){lw=440;lh=imgs.logo.height*lw/imgs.logo.width}ctx.drawImage(imgs.logo,M,y,lw,lh);ly=y+lh+16}
  ctx.textAlign="left";ctx.fillStyle=DARK;font(24,1);ctx.fillText(S.empresa,M,ly+20,620);ly+=30;ctx.fillStyle=MUT;font(19);
  [[S.nit&&"NIT "+S.nit,S.tel&&"Tel. "+S.tel].filter(Boolean).join(" · "),S.ciudad].filter(Boolean).forEach(l=>{ctx.fillText(l,M,ly+20,620);ly+=27});
  ctx.textAlign="right";ctx.fillStyle=C;font(38,1);ctx.fillText("REPORTE DE SERVICIO",W-M,y+44,520);
  let ry=y+86;ctx.fillStyle=MUT;font(21);[`Fecha: ${fmtD(R.f||today())}`,j.tecnico&&`Técnico: ${j.tecnico}`,k&&`Contrato · visitas ${visN(kVis(k))[1].toLowerCase()}`].filter(Boolean).forEach(l=>{ctx.fillText(l,W-M,ry,520);ry+=30});
  y=Math.max(ly,ry)+14;ctx.fillStyle=C;ctx.fillRect(M,y,W-2*M,4);y+=28;
  const bw=(W-2*M-24)/2;font(21);
  const cl=[j.cliente,j.dir,j.tel&&"Tel.: "+j.tel].filter(Boolean).flatMap(l=>wrap(ctx,l,bw-40));
  const dl=[j.servicio,eq(j.equipo).n,k&&k.detalle].filter(Boolean).flatMap(l=>wrap(ctx,l,bw-40));
  const bh=62+Math.max(cl.length,dl.length,1)*30;
  const box=(x,label,lines)=>{ctx.fillStyle="#f2f6fa";rrect(ctx,x,y,bw,bh,14);ctx.fill();ctx.textAlign="left";ctx.fillStyle=C;font(17,1);ctx.fillText(label,x+20,y+34);lines.forEach((l,i)=>{ctx.fillStyle=i===0?DARK:"#33475a";font(i===0?23:21,i===0);ctx.fillText(l,x+20,y+66+i*30)})};
  box(M,"CLIENTE",cl);box(M+bw+24,"SERVICIO",dl);y+=bh+28;breaks.push(y);
  const SC={ok:["OK","#16a05c"],at:["ATENCIÓN","#d97706"],na:["N/A","#8a97a3"]};
  groups.forEach(gk=>{
    const items=CHK[gk].filter(it=>R.items[gk+"|"+it]);
    ctx.fillStyle=DARK;rrect(ctx,M,y,W-2*M,46,8);ctx.fill();ctx.fillStyle="#fff";font(19,1);ctx.textAlign="left";ctx.fillText(GRPN[gk].replace(/^\S+\s/,"").toUpperCase(),M+14,y+31);ctx.textAlign="right";ctx.fillText("ESTADO",W-M-14,y+31);y+=46;breaks.push(y);
    items.forEach((it,ri)=>{const s=R.items[gk+"|"+it];if(ri%2){ctx.fillStyle="#f6f9fc";ctx.fillRect(M,y,W-2*M,44)}
      ctx.textAlign="left";ctx.fillStyle=DARK;font(21);ctx.fillText(it,M+14,y+30,760);
      ctx.fillStyle=SC[s][1];ctx.beginPath();ctx.arc(W-M-170,y+23,8,0,Math.PI*2);ctx.fill();ctx.textAlign="right";font(20,1);ctx.fillText(SC[s][0],W-M-14,y+30);
      y+=44;ctx.fillStyle="#e3e9ef";ctx.fillRect(M,y-1,W-2*M,1);breaks.push(y)});
    y+=16;
  });
  for(const [t,txt] of [["Mediciones",R.med],["Observaciones",R.obs],["Recomendaciones",R.rec]]){if(!String(txt||"").trim())continue;
    y+=14;ctx.textAlign="left";ctx.fillStyle=C;font(18,1);ctx.fillText(t.toUpperCase(),M,y+20);y+=32;ctx.fillStyle="#33475a";font(21);
    for(const l of wrap(ctx,txt,W-2*M)){ctx.fillText(l,M,y+22);y+=30;breaks.push(y)}}
  if(v.imgs.length){y+=20;ctx.textAlign="left";ctx.fillStyle=C;font(18,1);ctx.fillText("REGISTRO FOTOGRÁFICO",M,y+20);y+=36;breaks.push(y);
    const cw=(W-2*M-24)/2;
    for(let i=0;i<v.imgs.length;i+=2){const row=v.imgs.slice(i,i+2);const hs=row.map(im=>Math.min(560,cw*im.height/im.width));const rh=Math.max(...hs);
      row.forEach((im,k2)=>{const w=Math.min(cw,rh*im.width/im.height),h=w*im.height/im.width;const x=M+k2*(cw+24)+(cw-w)/2;ctx.save();rrect(ctx,x,y,w,h,10);ctx.clip();ctx.drawImage(im,x,y,w,h);ctx.restore()});
      y+=rh+20;breaks.push(y)}}
  if(imgs.firma||S.firmaNombre){y+=36;ctx.textAlign="left";
    if(imgs.firma){const fh=100,fw=Math.min(360,imgs.firma.width*fh/imgs.firma.height);ctx.drawImage(imgs.firma,M,y,fw,fw*imgs.firma.height/imgs.firma.width);y+=102}else y+=50;
    ctx.fillStyle=DARK;ctx.fillRect(M,y,400,2);font(21,1);ctx.fillText(S.firmaNombre||S.empresa,M,y+30,400);y+=50}
  breaks.push(y);y+=30;ctx.textAlign="center";if(S.pie){ctx.fillStyle=MUT;font(19);for(const l of wrap(ctx,S.pie,W-2*M)){ctx.fillText(l,W/2,y+20);y+=27}}
  y+=40;return {h:y,breaks};
}

function paintBadges(){const b=document.querySelector('#tabs [data-tab="ventas"]');if(!b)return;let i=b.querySelector("i.bdg");const n=leadsDue().length;if(n){if(!i){i=document.createElement("i");i.className="bdg";b.append(i)}i.textContent=n>9?"9+":n}else if(i)i.remove()}
/* ================= arranque ================= */
render();
initStore();
})();
