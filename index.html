<title>Vortice Taller</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Layout: phone-first app shell like Vortice Docs — fixed top bar, one view at a time, bottom tab bar; sheets slide up for forms. Single dark theme by choice, to match Vortice. */
:root{
  --bg:#070b12; --s1:#101826; --s2:#172234; --s3:#1f2d43; --line:#22324a; --line2:#2f4566;
  --text:#eaf1f8; --mut:#8ea2b8; --brand:#2f8cff; --brand2:#22d3ee; --ok:#22c57a; --warn:#ffb020; --bad:#ff5d6c; --cost:#ff8a4c;
  --f-d:"Sora","Manrope",system-ui,sans-serif; --f-b:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:radial-gradient(900px 520px at 0% -8%,rgba(47,140,255,.20),transparent 62%),radial-gradient(700px 460px at 105% 4%,rgba(34,211,238,.13),transparent 60%),var(--bg);background-attachment:fixed;color:var(--text);font:15px/1.5 var(--f-b);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0a111c}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:rgba(10,17,28,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font:700 .95rem var(--f-d);color:#04101f;flex:none}
.top h1{margin:0;font:700 1.05rem var(--f-d);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font:500 .72rem var(--f-b);color:var(--mut)}
.back{background:none;border:0;color:var(--brand2);font-weight:700;padding:6px 4px}
.sync{font-size:.7rem;font-weight:700;padding:4px 8px;border-radius:99px;background:var(--s2);color:var(--mut);white-space:nowrap}
.sync.ok{color:var(--ok)}
.icon{background:var(--s2);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:1.05rem;flex:none}
main{max-width:720px;margin:0 auto;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(10,17,28,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:720px;margin:0 auto;display:flex}
.tabs button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:1.3rem;position:relative}
.tabs button span{font-size:.68rem;font-weight:700}
.tabs button.on{color:var(--text)}
.tabs button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.view{display:grid;gap:14px}
h2{margin:0;font:700 1.3rem/1.2 var(--f-d);text-wrap:balance}
h3{margin:6px 0 0;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:800}
.muted{color:var(--mut);font-size:.86rem}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.hero{background:linear-gradient(135deg,rgba(47,140,255,.22),rgba(34,211,238,.10));border:1px solid var(--line2);border-radius:20px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.kpi small{display:block;color:var(--mut);font-size:.72rem;font-weight:700}
.kpi b{display:block;font:700 1.12rem var(--f-d);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis.mini{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.kpis.mini .kpi{padding:8px 6px;text-align:center}.kpis.mini small{font-size:.6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi i{font-style:normal;font-size:.72rem;font-weight:700}
.up{color:var(--ok)}.down{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-weight:800;background:var(--s2);color:var(--text);text-decoration:none;min-height:46px}
.btn:active{transform:scale(.98)}
.btn.p{background:linear-gradient(135deg,var(--brand),#1f6fd1);border-color:transparent;color:#fff}
.btn.g{background:#1a9d5f;border-color:transparent;color:#fff}
.btn.wa{background:#1fae5b;border-color:transparent;color:#fff}
.btn.d{background:transparent;color:var(--bad);border-color:#5a2a33}
.btn.sm{min-height:36px;padding:7px 11px;font-size:.84rem;border-radius:10px}
.btn.w{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 4px;display:grid;gap:4px;justify-items:center;font-size:1.4rem}
.quick button span{font-size:.7rem;font-weight:700;color:var(--mut);text-align:center;line-height:1.2}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--s2);border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:7px 12px;font-size:.84rem;font-weight:700;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip em{font-style:normal;opacity:.75;margin-left:4px}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mut);border-radius:9px;padding:9px 4px;font-weight:800;font-size:.8rem;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--s3);color:var(--text)}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%;min-width:0}
.row .em{font-size:1.5rem;width:42px;height:42px;border-radius:12px;background:var(--s2);display:grid;place-items:center;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:block;color:var(--mut);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{text-align:right;white-space:nowrap;font-weight:800}
.row .rt small{display:block;font-weight:600;color:var(--mut);font-size:.74rem}
.pill{display:inline-block;font-size:.68rem;font-weight:800;padding:3px 8px;border-radius:99px;background:#1d3150;color:#9ec9ff;white-space:nowrap}
.pill.programado{background:#1d3150;color:#9ec9ff}.pill.confirmado{background:#0f3a3f;color:#5fe3f0}.pill.en_curso{background:#3d3112;color:#ffcf66}.pill.terminado{background:#123b29;color:#5fe0a0}.pill.cancelado{background:#3d1720;color:#ff9aa5}
.empty{text-align:center;padding:22px 14px;color:var(--mut);border:1px dashed var(--line2);border-radius:var(--r)}
.empty b{display:block;color:var(--text);font-size:1rem;margin-bottom:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tile{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:12px 6px;display:grid;justify-items:center;gap:4px;text-align:center}
.tile i{font-style:normal;font-size:1.6rem}
.tile span{font-size:.74rem;font-weight:700;line-height:1.2}
.tile.on{border-color:var(--brand2);background:rgba(34,211,238,.12)}
label.f{display:grid;gap:5px;font-size:.78rem;font-weight:700;color:var(--mut);min-width:0}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px;color:var(--text);min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);border-color:transparent}
.fg{display:grid;gap:10px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.quick span{font-size:.64rem}}
/* week strip */
.week{display:grid;grid-template-columns:auto repeat(7,1fr) auto;gap:4px;align-items:stretch}
.week .nav{background:none;border:0;color:var(--mut);font-size:1.3rem;padding:0 2px}
.day{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:7px 0;display:grid;justify-items:center;gap:1px}
.day small{font-size:.64rem;color:var(--mut);font-weight:800;text-transform:uppercase}
.day b{font:700 1rem var(--f-d)}
.day .dots{height:6px;display:flex;gap:2px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--brand2)}
.day.on{background:linear-gradient(160deg,var(--brand),#1f6fd1);border-color:transparent}
.day.on small{color:#dbe9ff}.day.on .dots i{background:#fff}
.day.today b{color:var(--brand2)}.day.on.today b{color:#fff}
.job{display:grid;grid-template-columns:58px 1fr;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.job .h{font:700 1rem var(--f-d);text-align:center;border-right:1px solid var(--line);padding-right:10px}
.job .h small{display:block;font:600 .7rem var(--f-b);color:var(--mut)}
.job .b{min-width:0;display:grid;gap:4px}
.job .b b{overflow-wrap:anywhere}
.job .b small{color:var(--mut);font-size:.8rem;overflow-wrap:anywhere}
.job .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
/* chart */
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--mut);font-weight:700}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;gap:8px}
.hbar div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:.84rem}
.hbar span.t{height:7px;border-radius:4px;background:var(--s2);grid-column:1/-1;overflow:hidden}
.hbar span.t i{display:block;height:100%;border-radius:4px}
table.t{width:100%;border-collapse:collapse;font-size:.8rem}
table.t th,table.t td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--mut);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.tot{display:flex;justify-content:space-between;gap:10px;padding:6px 0;color:var(--mut)}
.tot b{color:var(--text)}
.tot.big{font:700 1.2rem var(--f-d);color:var(--text);border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
/* chat */
.chathead{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.thread{display:grid;gap:14px}
.msg.user{justify-self:end;max-width:88%;background:linear-gradient(135deg,var(--brand),#1f6fd1);color:#fff;border-radius:16px 16px 4px 16px;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user small{display:block;opacity:.8;font-size:.72rem;margin-top:4px}
.msg.bot{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px 12px;min-width:0}
.msg.bot .tag{display:flex;justify-content:space-between;align-items:center;padding-top:8px;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand2)}
.md{overflow-wrap:anywhere}
.md h2{font:700 1.02rem var(--f-d);color:var(--brand2);margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.md h3{font:700 .92rem var(--f-d);color:var(--text);text-transform:none;letter-spacing:0;margin:12px 0 4px}
.md p{margin:7px 0}.md ul,.md ol{margin:6px 0;padding-left:1.25em}.md li{margin:3px 0}
.md code{background:var(--s2);padding:1px 5px;border-radius:5px;font-size:.88em}
.md pre{background:var(--s2);padding:10px;border-radius:10px;overflow-x:auto}
.md blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--warn);background:var(--s2);border-radius:0 10px 10px 0}
.md .tbl{overflow-x:auto;margin:8px 0}
.md table{border-collapse:collapse;font-size:.86rem;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.md th{background:var(--s2)}
.md a{color:var(--brand2)}
.thinking{color:var(--mut);font-style:italic;padding:10px 0}
.thinking::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.note{font-size:.82rem;color:var(--bad);margin-top:6px}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:7;background:linear-gradient(to top,var(--bg) 72%,transparent);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.composer .in{max-width:720px;margin:0 auto}
.cbox{background:var(--s1);border:1px solid var(--line2);border-radius:16px;padding:8px;display:grid;gap:6px}
.cbox textarea{border:0;background:transparent;min-height:44px;max-height:170px;resize:none;padding:6px 8px}
.cbox textarea:focus{outline:none}
.crow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crow .grow{flex:1}
.tool{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:.8rem;font-weight:800;color:var(--text)}
.tool.on{border-color:var(--brand2);color:var(--brand2)}
.tool.rec{border-color:var(--bad);color:var(--bad)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{position:relative;width:54px;height:54px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:20px;padding:0}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(2,6,12,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet>.pan{background:var(--s1);border:1px solid var(--line2);border-bottom:0;width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet .hd h2{font-size:1.1rem}
.x{background:var(--s2);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;font-size:1rem;flex:none}
.preview{background:#0b141f;border:1px solid var(--line);border-radius:14px;padding:12px;white-space:pre-wrap;font-size:.9rem;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#eaf1f8;color:#07101c;padding:10px 16px;border-radius:99px;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;z-index:40;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top gut"><div class="in">
  <button class="back" id="hBack" type="button" hidden>‹ Volver</button>
  <div class="logo" id="hLogo">V</div>
  <h1 id="hTitle">Vortice Taller<small id="hSub">Asistente · Agenda · Finanzas · Facturas</small></h1>
  <span class="sync" id="sync">Cargando…</span>
  <button class="icon" type="button" data-act="settings" aria-label="Ajustes">⚙️</button>
</div></header>

<main class="gut" id="view"></main>

<nav class="tabs" id="tabs"><div class="in">
  <button type="button" data-tab="inicio">🏠<span>Inicio</span></button>
  <button type="button" data-tab="asistente">🧠<span>Asistente</span></button>
  <button type="button" data-tab="agenda">📅<span>Agenda</span></button>
  <button type="button" data-tab="finanzas">💰<span>Finanzas</span></button>
  <button type="button" data-tab="facturas">🧾<span>Facturas</span></button>
</div></nav>

<div class="composer gut" id="composer" hidden><div class="in">
  <div class="cbox">
    <div class="thumbs" id="thumbs" hidden></div>
    <textarea id="q" rows="2" placeholder="Escribe la pregunta o lo que mediste…"></textarea>
    <div class="crow">
      <button class="tool" id="photoBtn" type="button" hidden>📷 Foto</button>
      <button class="tool" id="micBtn" type="button" hidden>🎙️ Dictar</button>
      <button class="tool" id="deepBtn" type="button">🔬 A fondo</button>
      <span class="grow"></span>
      <button class="btn p sm" id="sendBtn" type="button">Preguntar</button>
    </div>
  </div>
</div></div>

<div id="sheetRoot"></div>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" hidden>

<script>
"use strict";
(function(){
/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(typeof v==="number")return v;v=String(v||"").replace(/[^\d,.\-]/g,"");if(v.includes(","))v=v.replace(/\./g,"").replace(",",".");else if((v.match(/\./g)||[]).length>1||/\.\d{3}$/.test(v))v=v.replace(/\./g,"");return parseFloat(v)||0};
const money=n=>"$ "+Math.round(+n||0).toLocaleString("es-CO");
const short=n=>{n=Math.round(+n||0);const a=Math.abs(n);if(a>=1e6)return "$"+(n/1e6).toLocaleString("es-CO",{maximumFractionDigits:1})+"M";if(a>=1e3)return "$"+Math.round(n/1e3)+"k";return "$"+n};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const isoOf=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dOf=iso=>new Date(iso+"T12:00:00");
const addDays=(iso,n)=>{const d=dOf(iso);d.setDate(d.getDate()+n);return isoOf(d)};
const MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIA=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const fmtD=iso=>{if(!iso)return "";const [y,m,d]=iso.split("-");return `${d}/${m}/${y}`};
const longD=iso=>{const d=dOf(iso);return `${DIA[d.getDay()]} ${d.getDate()} de ${MES[d.getMonth()]}`};
const mk=iso=>iso.slice(0,7);
const mkAdd=(k,n)=>{let [y,m]=k.split("-").map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return `${y}-${String(m).padStart(2,"0")}`};
const mkName=(k,s)=>{const [y,m]=k.split("-").map(Number);const n=MES[m-1];return s?n.slice(0,3):n.charAt(0).toUpperCase()+n.slice(1)+" "+y};
const hora12=h=>{if(!h)return "";let [H,M]=h.split(":").map(Number);const ap=H>=12?"p. m.":"a. m.";H=H%12||12;return `${H}:${String(M).padStart(2,"0")} ${ap}`};

function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),2300)}

let readOnly=false;
function cache(name){LS.set(name,D[name])}
function setSync(t,ok){const s=$("#sync");s.textContent=t;s.classList.toggle("ok",!!ok)}
function dbErr(e){const c=e&&e.code;if(c==="invalid_argument"){readOnly=true;toast("No tienes permiso para guardar aquí")}else if(c==="quota_exceeded")toast("Espacio lleno: borra registros viejos");else toast("No se pudo guardar. Revisa tu conexión")}
function put(name,obj){
  obj.id=obj.id||uid();obj.upd=Date.now();
  const arr=D[name];const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj);
  cache(name);
  if(D.mode==="cloud"){const {id,...rest}=obj;return D.base.collection(name).doc(id).set(JSON.parse(JSON.stringify(rest))).catch(dbErr)}
  return Promise.resolve();
}
function del(name,id){
  D[name]=D[name].filter(x=>x.id!==id);cache(name);
  if(D.mode==="cloud")return D.base.collection(name).doc(id).delete().catch(dbErr);
  return Promise.resolve();
}
function saveCfg(){LS.set("cfg",D.cfg);if(D.mode==="cloud")D.base.set(JSON.parse(JSON.stringify({cfg:D.cfg}))).catch(dbErr)}

async function initStore(){
  let db=null,user=null;
  try{[db,user]=await Promise.all([window.claude?.use("db"),window.claude?.use("user")])}catch(e){}
  let id=null;try{id=user?await user.id():null}catch(e){}
  if(!db||!id){setSync("En este celular");return}
  D.mode="cloud";D.base=db.doc("data/users/"+id+"/meta");
  setSync("Sincronizando…");
  let first=0;const timer=setTimeout(()=>{if(first<COLS.length)setSync("Sin conexión")},10000);
  D.base.onSnapshot(s=>{const c=s.exists&&s.data()&&s.data().cfg;if(c){D.cfg=c;LS.set("cfg",c);paintHead()}},()=>{});
  COLS.forEach(name=>{
    let got=false;
    D.base.collection(name).onSnapshot(s=>{
      D[name]=s.docs.map(d=>Object.assign({id:d.id},d.data()));cache(name);
      if(!got){got=true;first++;if(first===COLS.length){clearTimeout(timer);setSync("☁️ En tu cuenta",true);migrateLocal()}}
      soon();
    },e=>{clearTimeout(timer);setSync("Sin conexión")});
  });
}

function vInfo(){return D.vortice.find(x=>x.id==="info")||null}
function vRows(){return D.vortice.filter(x=>/^d\d+$/.test(x.id)).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true})).flatMap(x=>x.rows||[])}
function vClients(){const i=vInfo();return i&&i.clients||[]}
function vSales(){
  const rows=vRows();const refs=rows.filter(r=>r.t==="rc").map(r=>r.ref||"").join(" | ");
  const out=[];
  rows.forEach(r=>{
    if(r.t==="rc")out.push({f:r.f,monto:r.tot,desc:`Recibo ${r.n} · ${r.c||"Cliente"}`,src:"v"});
    else if(r.t==="cc"&&r.e==="pagado"&&!(r.n&&refs.includes(r.n)))out.push({f:r.f,monto:r.tot,desc:`Cuenta ${r.n} pagada · ${r.c||"Cliente"}`,src:"v"});
  });
  return out;
}
function vCobrar(){return vRows().filter(r=>r.t==="cc"&&r.e!=="pagado"&&r.sal>0)}
function vCotPend(){return vRows().filter(r=>r.t==="cot"&&r.e==="pendiente")}
async function importVortice(file){
  let b;try{b=JSON.parse(await file.text())}catch(e){toast("Ese archivo no es una copia de Vortice");return}
  if(!b||b.app!=="vortice-docs"||!Array.isArray(b.DOCS)){toast("Ese archivo no es una copia de Vortice");return}
  const calc=d=>{const sub=(d.items||[]).reduce((a,it)=>a+num(it.c)*num(it.p),0);const desc=sub*num(d.desc)/100,base=sub-desc;const iva=d.ivaOn?base*num(d.ivaPct)/100:0,total=base+iva;const abono=d.tipo==="rc"?total:num(d.abono);const pag=d.estado==="pagado"?total:Math.min(abono,total);return {total,pag,saldo:Math.max(total-pag,0)}};
  const rows=b.DOCS.map(d=>{const t=calc(d);const c=d.cliente||{};return {t:d.tipo,n:d.num||"",f:d.fecha||today(),c:c.nombre||"",tel:c.tel||"",dir:c.dir||"",tot:Math.round(t.total),pag:Math.round(t.pag),sal:Math.round(t.saldo),e:d.estado||"",ref:(d.ref||"").slice(0,80),it:((d.items||[])[0]||{}).d?String(d.items[0].d).slice(0,70):""}});
  const S=b.S||{};
  const clients=(b.CLI||[]).map(c=>({n:c.nombre||"",tel:c.tel||"",dir:c.dir||""})).filter(c=>c.n);
  rows.forEach(r=>{if(r.c&&!clients.some(c=>c.n.toLowerCase()===r.c.toLowerCase()))clients.push({n:r.c,tel:r.tel,dir:r.dir})});
  const CH=500,chunks=[];for(let i=0;i<rows.length;i+=CH)chunks.push(rows.slice(i,i+CH));
  const old=D.vortice.filter(x=>/^d\d+$/.test(x.id)).map(x=>x.id);
  await put("vortice",{id:"info",fecha:new Date().toISOString(),copia:b.fecha||"",empresa:S.empresa||"",tel:S.tel||"",ciudad:S.ciudad||"",pago:S.pago||"",nDocs:rows.length,clients:clients.slice(0,1500)});
  for(let i=0;i<chunks.length;i++)await put("vortice",{id:"d"+i,rows:chunks[i]});
  for(const id of old)if(+id.slice(1)>=chunks.length)await del("vortice",id);
  if(S.empresa&&!D.cfg.empresa){D.cfg.empresa=S.empresa;D.cfg.tel=D.cfg.tel||S.tel||"";saveCfg()}
  toast(`Vortice sincronizado: ${rows.length} documentos ✔`);render();
}
function allClients(){
  const m=new Map();
  vClients().forEach(c=>m.set(c.n.toLowerCase(),c));
  D.trabajos.forEach(j=>{if(j.cliente&&!m.has(j.cliente.toLowerCase()))m.set(j.cliente.toLowerCase(),{n:j.cliente,tel:j.tel||"",dir:j.dir||""})});
  return [...m.values()].sort((a,b)=>a.n.localeCompare(b.n));
}

/* ================= finanzas: cálculos ================= */
function incluirV(){return D.cfg.incluirV!==false}
function monthData(k){
  const ms=D.movs.filter(m=>mk(m.fecha||"")===k);
  let ing=ms.filter(m=>m.tipo==="ingreso").reduce((a,m)=>a+num(m.monto),0);
  const vs=incluirV()?vSales().filter(s=>mk(s.f)===k):[];
  const ingV=vs.reduce((a,s)=>a+s.monto,0);
  const costo=ms.filter(m=>m.tipo==="egreso"&&clase(m.cat)==="costo").reduce((a,m)=>a+num(m.monto),0);
  const gasto=ms.filter(m=>m.tipo==="egreso"&&clase(m.cat)!=="costo").reduce((a,m)=>a+num(m.monto),0);
  ing+=ingV;
  return {k,ing,ingV,costo,gasto,egr:costo+gasto,util:ing-costo-gasto,margen:ing?((ing-costo-gasto)/ing*100):0,ms,vs};
}
function projection(k,esc){
  // usa los meses cerrados con movimientos antes del mes actual
  const cur=mk(today());const hist=[];
  for(let i=1;i<=6;i++){const m=mkAdd(cur,-i);const d=monthData(m);if(d.ing||d.egr)hist.unshift(d)}
  const fac=esc==="cons"?0.85:esc==="opt"?1.15:1;
  if(hist.length<2)return {ok:false,hist,rows:[]};
  const fit=key=>{const ys=hist.map(h=>h[key]);const n=ys.length;const avg=ys.reduce((a,b)=>a+b,0)/n;
    if(n<3)return i=>avg;
    const xs=ys.map((_,i)=>i);const mx=(n-1)/2;let sxy=0,sxx=0;xs.forEach((x,i)=>{sxy+=(x-mx)*(ys[i]-avg);sxx+=(x-mx)**2});const b=sxx?sxy/sxx:0;
    return i=>Math.max(0,0.5*avg+0.5*(avg+b*(n-1+i-mx)))};
  const fi=fit("ing"),fe=fit("egr");
  const rows=[0,1,2].map(i=>{const m=mkAdd(cur,i);const ing=fi(i+1)*fac,egr=fe(i+1);return {k:m,ing,egr,util:ing-egr}});
  return {ok:true,hist,rows};
}

const RULES=`Eres el asistente técnico de un taller colombiano de refrigeración comercial e industrial, aire acondicionado, hornos de panadería (rotativos, atmosféricos, de pisos, tótem, gaveteros, pandeboneros, fermentadoras), soldadura y estructuras metálicas, y electricidad. Respondes a un técnico profesional como lo haría un técnico senior con 30 años de campo y formación de ingeniería.

Contexto: Colombia, 60 Hz, tensiones 120, 208, 220/240 y 440/480 V; gas natural y GLP. Normas de referencia cuando apliquen: RETIE, NTC 2050, Resolución 90902 de 2013 (instalaciones de gas), NTC 2505, ASHRAE, AWS D1.1/D1.3. Da unidades métricas y, cuando ayude, las de campo (psi, °F, BTU/h, TR, AWG).

Cómo respondes:
- En español, directo y elaborado: cada frase aporta algo aplicable. Sin saludos ni relleno.
- Para fallas o códigos usa estas secciones con "##":
  ## Diagnóstico rápido (causa más probable en 2-3 líneas y por qué)
  ## Causas probables (de más a menos probable, con la señal que la confirma o descarta)
  ## Pruebas paso a paso (qué medir, con qué instrumento, dónde y el valor normal; usa tablas para comparar valores)
  ## Solución y opciones (repuesto original, equivalente o arreglo provisional, con ventajas, riesgos y costo relativo)
  ## Seguridad (solo lo que aplica: gas, refrigerante inflamable, tensión, presión, humos)
  ## Fuentes (manuales o boletines del fabricante, normas, tablas P-T, guías técnicas reales: Copeland/Emerson, Danfoss, Sporlan, Tecumseh, Embraco, Bitzer, Honeywell, Carrier, LG, Samsung, Lincoln Electric, Miller, ASHRAE, RSES…)
- Para instalación, mantenimiento, cálculo, repuestos o normas, adapta: resultado o lista de pasos primero, luego procedimiento con números y fórmulas, luego fuentes.
- Si faltan datos que cambian el diagnóstico, da igual la mejor ruta y cierra con "## Para afinar" con máximo 3 preguntas concretas.
- Exactitud: no inventes códigos de error, valores de placa, números de parte, títulos de documentos ni enlaces. Si un dato depende de la marca o el modelo y no estás seguro, dilo e indica dónde verificarlo. Distingue dato de fabricante o norma de práctica de campo.
- Si hay fotos, primero di lo que lees en ellas (placa, código, cableado, estado) y úsalo.`;

const SERR={not_granted:"No se autorizó el uso de Claude en esta página. Recárgala y acepta el permiso.",sampling_disabled:"Claude no está disponible para esta cuenta.",rate_limited:"Llegaste al límite de consultas por ahora. Intenta en unos minutos.",session_expired:"Tu sesión expiró. Inicia sesión de nuevo y recarga.",image_rejected:"Esa foto no se pudo usar. Prueba con otra JPG o PNG.",images_unavailable:"Aquí no se pueden enviar fotos; escribe lo que dice la placa.",refused:"No hubo respuesta para esa consulta. Reformúlala con más detalle técnico.",empty_completion:"No llegó respuesta. Intenta de nuevo.",prompt_too_large:"La consulta es muy larga. Empieza una nueva.",upstream_error:"Se cortó la conexión. Toca Preguntar de nuevo."};
async function ask(){
  if(busy){ctl&&ctl.abort();return}
  if(!SUB||SUB.kind!=="chat")return;
  const c=D.consultas.find(x=>x.id===SUB.id);if(!c)return;
  const text=q.value.trim();if(!text&&!pending.length)return;
  if(!sample){toast("Abre este enlace en claude.ai con tu cuenta para preguntar");return}
  const imgs=pending.slice();const e=eq(c.equipo),t=tc(c.tipo);const dat=c.datos||{};
  let content="";
  if(!(c.turns||[]).length){
    content+=`[Equipo: ${e.n} — ${e.d}]\n[Tipo de consulta: ${t.n}]\n`;
    const dl=[["Marca/modelo",dat.modelo],["Refrigerante/gas",dat.gas],["Alimentación",dat.volt],["Mediciones",dat.med]].filter(x=>x[1]);
    if(dl.length)content+="[Datos del equipo]\n"+dl.map(x=>`- ${x[0]}: ${x[1]}`).join("\n")+"\n";
    content+="\n";
  }
  if(imgs.length)content+=`[Adjunto ${imgs.length} foto(s): léelas y úsalas]\n`;
  content+=text||"Analiza las fotos y dime qué ves y qué revisar.";
  const ut={role:"user",content,display:text||"(fotos)",photos:imgs.length||0};
  c.turns=(c.turns||[]).concat([ut]);
  const th=$("#thread");if(th.querySelector(".empty"))th.innerHTML="";
  th.append(userBubble(ut));
  q.value="";autosize();pending=[];paintThumbs();
  const bot=botBubble(null);bot._thinking();th.append(bot);bot.scrollIntoView({behavior:"smooth",block:"start"});
  busy=true;$("#sendBtn").textContent="Detener";
  ctl=new AbortController();
  const hist=c.turns.slice(-12).map(x=>({role:x.role,content:x.content}));while(hist.length&&hist[0].role!=="user")hist.shift();
  const ctx=`${RULES}\n\nEsta conversación es sobre: ${e.n} (${e.d}). Tipo de consulta: ${t.n}.`;
  const opts={cache:false,signal:ctl.signal,modelTier:deep?"complex":"default",onText:({text})=>bot._set(text)};
  if(imgs.length&&canImages)opts.images=imgs;
  try{
    const r=await sample([{role:"user",content:ctx},...hist],opts);
    bot._set(r.text);c.turns.push({role:"assistant",content:r.text});
    if(r.truncated)bot._note("La respuesta quedó cortada. Pide que continúe.");
  }catch(err){
    const code=err&&err.code;
    if(err&&err.text){bot._set(err.text);c.turns.push({role:"assistant",content:err.text})}
    if(code==="cancelled"){if(!err.text)bot.remove()}
    else bot._note(SERR[code]||SERR.upstream_error);
  }finally{
    busy=false;$("#sendBtn").textContent="Preguntar";
    c.turns=c.turns.slice(-16).map(x=>x.content&&x.content.length>24000?Object.assign({},x,{content:x.content.slice(0,24000)}):x);
    put("consultas",c);
  }
}

function barChart(series,proj,sel){
  const all=[...series.map(s=>({k:s.k,a:s.ing,b:s.egr,p:false})),...proj.map(p=>({k:p.k,a:p.ing,b:p.egr,p:true}))];
  const W=Math.max(420,all.length*62),H=210,pl=44,pb=28,pt=18,ch=H-pt-pb;
  const max=Math.max(1,...all.map(x=>Math.max(x.a,x.b)));
  const step=Math.pow(10,Math.floor(Math.log10(max)));const nice=Math.ceil(max/step)*step;const top=nice<max*1.05?nice+step:nice;
  const y=v=>pt+ch-(v/top)*ch;const gw=(W-pl-8)/all.length;const bw=Math.min(18,gw*0.3);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y egresos por mes"><defs><pattern id="hp" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.5" height="5" fill="#2f8cff"></rect></pattern><pattern id="hc" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.5" height="5" fill="#ff8a4c"></rect></pattern></defs>`;
  for(let i=0;i<=4;i++){const v=top*i/4;s+=`<line x1="${pl}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="#22324a" stroke-width="1"></line><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#8ea2b8">${esc(short(v))}</text>`}
  all.forEach((x,i)=>{const cx=pl+gw*i+gw/2;const on=x.k===sel;
    const r=(v,dx,fill,pat)=>{const h=Math.max(v>0?2:0,ch*(v/top));return `<rect x="${cx+dx}" y="${pt+ch-h}" width="${bw}" height="${h}" rx="3" fill="${x.p?`url(#${pat})`:fill}" ${x.p?`stroke="${fill}" stroke-width="1"`:""} opacity="${on||x.p?1:.78}"></rect>`};
    s+=r(x.a,-bw-1,"#2f8cff","hp")+r(x.b,1,"#ff8a4c","hc");
    s+=`<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="11" font-weight="${on?800:600}" fill="${on?"#eaf1f8":"#8ea2b8"}">${esc(mkName(x.k,true))}${x.p?"*":""}</text>`;
    if(on&&(x.a||x.b))s+=`<text x="${cx}" y="${Math.max(12,y(Math.max(x.a,x.b))-6)}" text-anchor="middle" font-size="10" font-weight="800" fill="#eaf1f8">${esc(short(x.a-x.b))}</text>`;
  });
  return s+"</svg>";
}

function vCotizar(B){
  const s=LS.get("cot",{mat:[{d:"",v:""}],hT:"4",tT:String(D.cfg.tarifa||"35000"),hA:"0",tA:"20000",tr:"",imp:"10",mar:String(D.cfg.margen||"35"),iva:false});
  const save=()=>LS.set("cot",s);
  const calc=()=>{const mat=s.mat.reduce((a,x)=>a+num(x.v),0),mo=num(s.hT)*num(s.tT),ay=num(s.hA)*num(s.tA),tr=num(s.tr);const base=mat+mo+ay+tr,imp=base*num(s.imp)/100,costo=base+imp;const mg=Math.min(num(s.mar),90)/100;const precio=costo/(1-mg);const iva=s.iva?precio*.19:0;return {mat,mo:mo+ay,tr,imp,costo,precio,iva}};
  const totals=()=>{const c=calc();B.querySelector("#cTot").innerHTML=`<div class="tot"><span>Materiales</span><b>${money(c.mat)}</b></div><div class="tot"><span>Mano de obra (técnico + ayudante)</span><b>${money(c.mo)}</b></div><div class="tot"><span>Transporte</span><b>${money(c.tr)}</b></div><div class="tot"><span>Imprevistos</span><b>${money(c.imp)}</b></div>
      <div class="tot"><span>Costo total del trabajo</span><b style="color:var(--cost)">${money(c.costo)}</b></div><div class="tot"><span>Precio sin IVA</span><b>${money(c.precio)}</b></div>${s.iva?`<div class="tot"><span>IVA 19 %</span><b>${money(c.iva)}</b></div>`:""}
      <div class="tot big"><span>Precio sugerido</span><span style="color:var(--brand2)">${money(c.precio+c.iva)}</span></div><div class="tot"><span>Tu utilidad</span><b class="up">${money(c.precio-c.costo)}</b></div>`};
  const matRows=()=>s.mat.map((x,i)=>`<div style="display:grid;grid-template-columns:1fr 110px 34px;gap:6px"><input data-i="${i}" data-k="d" value="${esc(x.d)}" placeholder="Ej: Capacitor 35+5 µF"><input data-i="${i}" data-k="v" inputmode="numeric" value="${esc(x.v)}" placeholder="$ 0"><button class="x" type="button" data-rm="${i}" aria-label="Quitar">✕</button></div>`).join("");
  B.innerHTML=`<div class="card fg"><b>🧮 Cotizar un trabajo</b><div class="muted">Calcula el precio justo: lo que te cuesta el trabajo más tu margen. Luego pásalo a una cotización en Vortice.</div>
     <h3>Materiales y repuestos</h3><div class="fg" id="cMat">${matRows()}</div>
     <button class="btn sm" type="button" id="cAdd" style="justify-self:start">＋ Agregar material</button>
     <h3>Mano de obra</h3>
     <div class="fg2"><label class="f">Horas técnico<input data-k="hT" inputmode="decimal" value="${esc(s.hT)}"></label><label class="f">Tarifa / hora<input data-k="tT" inputmode="numeric" value="${esc(s.tT)}"></label></div>
     <div class="fg2"><label class="f">Horas ayudante<input data-k="hA" inputmode="decimal" value="${esc(s.hA)}"></label><label class="f">Tarifa ayudante / hora<input data-k="tA" inputmode="numeric" value="${esc(s.tA)}"></label></div>
     <div class="fg2"><label class="f">Transporte<input data-k="tr" inputmode="numeric" value="${esc(s.tr)}" placeholder="$ 0"></label><label class="f">Imprevistos %<input data-k="imp" inputmode="decimal" value="${esc(s.imp)}"></label></div>
     <div class="fg2"><label class="f">Margen de utilidad %<input data-k="mar" inputmode="decimal" value="${esc(s.mar)}"></label><label class="f" style="align-content:end"><span style="display:flex;align-items:center;gap:8px;padding:11px 0"><input type="checkbox" id="cIva" ${s.iva?"checked":""} style="width:auto;transform:scale(1.3)"> Cobrar IVA 19 %</span></label></div></div>
    <div class="card"><div id="cTot"></div><div class="grid2" style="margin-top:8px"><button class="btn" type="button" id="cCopy">📋 Copiar detalle</button><a class="btn p" href="https://vortice-ec.netlify.app/app/" target="_blank" rel="noopener">🧾 Abrir Vortice</a></div></div>`;
  totals();
  B.addEventListener("input",e=>{const inp=e.target.closest("input[data-k]");if(!inp)return;const i=inp.dataset.i;if(i!=null)s.mat[+i][inp.dataset.k]=inp.value;else s[inp.dataset.k]=inp.value;save();totals()});
  const M=B.querySelector("#cMat");
  M.onclick=e=>{const b=e.target.closest("[data-rm]");if(b){s.mat.splice(+b.dataset.rm,1);if(!s.mat.length)s.mat.push({d:"",v:""});save();M.innerHTML=matRows();totals()}};
  B.querySelector("#cAdd").onclick=()=>{s.mat.push({d:"",v:""});save();M.innerHTML=matRows();const ins=M.querySelectorAll('input[data-k="d"]');ins[ins.length-1].focus()};
  B.querySelector("#cIva").onchange=e=>{s.iva=e.target.checked;save();totals()};
  B.querySelector("#cCopy").onclick=()=>{const c=calc();const lines=s.mat.filter(x=>x.d||num(x.v)).map(x=>`• ${x.d||"Material"}: ${money(num(x.v))}`);copyText(`COTIZACIÓN\n${lines.length?"Materiales:\n"+lines.join("\n")+"\n":""}• Mano de obra: ${money(c.mo)}\n${c.tr?"• Transporte: "+money(c.tr)+"\n":""}${c.imp?"• Imprevistos: "+money(c.imp)+"\n":""}\nPrecio${s.iva?" (IVA incluido)":""}: ${money(c.precio+c.iva)}`)};
}

function vFacturas(V){
  const info=vInfo();const rows=vRows();
  const cob=vCobrar().sort((a,b)=>b.sal-a.sal),cot=vCotPend().sort((a,b)=>(b.f||"").localeCompare(a.f||""));
  const k=mk(today());const ventasMes=vSales().filter(s=>mk(s.f)===k).reduce((a,s)=>a+s.monto,0);
  V.innerHTML=`<div class="view">
   <div class="hero" style="display:grid;gap:10px"><div style="display:flex;gap:12px;align-items:center"><div class="logo" style="width:46px;height:46px;font-size:1.2rem">🧾</div><div><h2>Vortice Docs</h2><div class="muted">Cotizaciones, cuentas de cobro y recibos con tu logo y firma.</div></div></div>
    <a class="btn p w" href="https://vortice-ec.netlify.app/app/" target="_blank" rel="noopener">Abrir Vortice Docs ↗</a></div>
   <div class="card fg"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><b>🔄 Sincronizar con Vortice</b>${info?`<span class="pill terminado">Última: ${esc(fmtD(info.fecha.slice(0,10)))}</span>`:`<span class="pill en_curso">Sin sincronizar</span>`}</div>
    <div class="muted">Así tus ventas, cuentas por cobrar y clientes aparecen aquí, en Finanzas y en la Agenda:</div>
    <div class="list">
     <div class="row"><span class="em">1</span><span class="tx" style="white-space:normal"><b style="white-space:normal">En Vortice Docs ve a ⚙️ Ajustes</b><small style="white-space:normal">Toca “💾 Hacer copia de seguridad” y guarda el archivo en el celular.</small></span></div>
     <div class="row"><span class="em">2</span><span class="tx" style="white-space:normal"><b style="white-space:normal">Vuelve aquí y carga la copia</b><small style="white-space:normal">Repite cuando quieras actualizar. Tus documentos en Vortice no se modifican.</small></span></div>
    </div>
    <button class="btn g w" type="button" data-act="importV">📂 Cargar copia de Vortice</button></div>
   ${info?`<div class="kpis">
     <div class="kpi"><small>Documentos</small><b>${rows.length}</b></div><div class="kpi"><small>Clientes</small><b>${vClients().length}</b></div>
     <div class="kpi"><small>Ventas ${esc(mkName(k,true))}</small><b class="up">${money(ventasMes)}</b></div><div class="kpi"><small>Por cobrar</small><b style="color:var(--warn)">${money(cob.reduce((a,r)=>a+r.sal,0))}</b></div></div>
    <h3>⏳ Cuentas por cobrar</h3>
    ${cob.length?`<div class="list">${cob.slice(0,30).map(r=>`<div class="row"><span class="em">💵</span><span class="tx"><b>${esc(r.c||"Sin cliente")}</b><small>${esc(r.n)} · ${esc(fmtD(r.f))}${r.it?" · "+esc(r.it):""}</small></span><span class="rt" style="color:var(--warn)">${money(r.sal)}<small><button class="btn wa sm" type="button" data-act="cobrar" data-n="${esc(r.n)}" style="margin-top:4px">📲 Cobrar</button></small></span></div>`).join("")}</div>`:`<div class="empty"><b>Todo cobrado 🎉</b>No hay cuentas de cobro pendientes.</div>`}
    <h3>📝 Cotizaciones por cerrar</h3>
    ${cot.length?`<div class="list">${cot.slice(0,30).map(r=>`<div class="row"><span class="em">🧾</span><span class="tx"><b>${esc(r.c||"Sin cliente")}</b><small>${esc(r.n)} · ${esc(fmtD(r.f))}${r.it?" · "+esc(r.it):""}</small></span><span class="rt">${money(r.tot)}<small><button class="btn sm" type="button" data-act="newJob" data-pre='${esc(JSON.stringify({cliente:r.c,tel:r.tel,dir:r.dir,notas:(r.n+" "+(r.it||"")).trim(),valor:r.tot}))}' style="margin-top:4px">📅 Agendar</button></small></span></div>`).join("")}</div>`:`<div class="empty"><b>Sin cotizaciones pendientes</b>Las cotizaciones en estado “pendiente” aparecen aquí para hacerles seguimiento.</div>`}`
   :`<div class="empty"><b>Aún no has cargado datos de Vortice</b>Sigue los dos pasos de arriba. Toma menos de un minuto.</div>`}
  </div>`;
}
function cobroSheet(r){
  const emp=D.cfg.empresa||(vInfo()||{}).empresa||"Vortice E&C";const pago=(vInfo()||{}).pago||"";const nom=(r.c||"").split(" ")[0];
  const txt=`💵 *Recordatorio de pago*\n\nHola ${nom} 👋, te escribimos de *${emp}*.\n\n🧾 *Cuenta de cobro:* ${r.n}\n📅 *Fecha:* ${fmtD(r.f)}\n${r.it?"🛠️ *Servicio:* "+r.it+"\n":""}💰 *Saldo pendiente:* ${money(r.sal)}\n${pago?"\n🏦 *Datos para el pago:*\n"+pago+"\n":""}\n🙏 Cuando realices el pago, envíanos el comprobante por aquí.\n\n¡Gracias! 🙌`;
  const tel=phone(r.tel);
  sheet("Cobrar por WhatsApp",`<textarea id="cbT" style="min-height:240px">${esc(txt)}</textarea><div class="grid2"><a class="btn wa" id="cbA" target="_blank" rel="noopener" href="#">📲 Enviar</a><button class="btn" type="button" id="cbC">📋 Copiar</button></div>`,pan=>{
    const T=pan.querySelector("#cbT"),A=pan.querySelector("#cbA");const p=()=>A.href=(tel?"https://wa.me/"+tel:"https://wa.me/")+"?text="+encodeURIComponent(T.value);p();T.oninput=p;
    pan.querySelector("#cbC").onclick=()=>copyText(T.value);
  });
}

   <label class="f">Nombre de la empresa (sale en los mensajes)<input id="sE" value="${esc(c.empresa||"")}" placeholder="Vortice E&C"></label>
   <div class="fg2"><label class="f">Tu nombre<input id="sN" value="${esc(c.tecnico||"")}" placeholder="Técnico principal"></label><label class="f">Teléfono de contacto<input id="sT" inputmode="tel" value="${esc(c.tel||"")}"></label></div>
   <div class="fg2"><label class="f">Tarifa por hora (cotizar)<input id="sR" inputmode="numeric" value="${esc(c.tarifa||"")}" placeholder="35000"></label><label class="f">Margen de utilidad %<input id="sM" inputmode="decimal" value="${esc(c.margen||"")}" placeholder="35"></label></div>
   <button class="btn p w" type="button" id="sS">Guardar</button>
   <div class="muted">${D.mode==="cloud"?"☁️ Tus datos se guardan en tu cuenta de Claude: los ves en cualquier celular donde abras este enlace con tu cuenta.":"📱 Ahora los datos se guardan solo en este celular. Abre el enlace en claude.ai con tu cuenta para guardarlos en la nube."}</div></div>`,pan=>{

  });
}
